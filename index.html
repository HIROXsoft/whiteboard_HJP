<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f8">
<title>SCHEDULE BOARD</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14202a;--muted:#64727c;--line:#d6dfe5;--accent:#0b5ea8;--danger:#a61b1b;--trip:#8a5a00;--direct:#0f7182;--shadow:0 3px 14px rgba(20,32,42,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}button,select,input{font:inherit}button,select{touch-action:manipulation}#app{max-width:760px;margin:0 auto;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:30;background:rgba(238,242,245,.98);backdrop-filter:blur(9px);padding:7px 9px 6px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:7px}.brand-logo{display:block;width:116px;height:auto}.appname{font-size:17px;font-weight:950;letter-spacing:.05em;white-space:nowrap}.top-actions{margin-left:auto;display:flex;align-items:center;gap:5px}.member-icon,.view-icon{width:34px;height:34px;border:1px solid #bcc8cf;background:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#334651;cursor:pointer}.member-icon svg,.view-icon svg{width:19px;height:19px;display:block}.member-icon:active,.view-icon:active{transform:scale(.95)}.view-icon.active{background:#0b5ea8;color:#fff;border-color:#0b5ea8}.sync{margin-left:0;border:1px solid #bcc8cf;background:#fff;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900;white-space:nowrap}.sync.ok{background:#e9f7ee;color:#176a35;border-color:#a8d9b7}.sync.saving,.sync.loading{background:#fff8dc;color:#765900;border-color:#e5d172}.sync.error{background:#fff0f0;color:#9b1c1c;border-color:#e1aaaa}
.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:5px;align-items:center;margin-top:7px}.navbtn,.weeklabel{height:39px;border:1px solid #c2cdd4;background:#fff;border-radius:11px;font-weight:950}.navbtn{font-size:20px}.weeklabel{display:flex;align-items:center;justify-content:center;font-size:14px}.todaybtn{width:100%;height:30px;border:0;background:transparent;color:var(--accent);font-weight:900;font-size:13px}
.dayhead{padding:8px 8px 7px;position:sticky;top:118px;z-index:20;background:rgba(238,242,245,.985);border-top:1px solid #cbd6dc;border-bottom:2px solid #b8c6ce;box-shadow:0 4px 10px rgba(20,32,42,.09)}.dayhead-spacer{display:none}.dayhead-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.dayh{position:relative;text-align:center;border:1px solid #c4d0d7;border-radius:10px;background:#fff;padding:7px 1px 6px;font-weight:950;line-height:1;min-height:52px}.dayh .weekday{display:block;font-size:21px;letter-spacing:.06em}.dayh .date{display:block;font-size:11px;margin-top:6px;color:#60717c;font-weight:950}.dayh.today{background:#d8ecff;border:3px solid #0b5ea8;color:#064d86;padding:5px 0 4px;box-shadow:0 0 0 2px rgba(11,94,168,.09),0 3px 9px rgba(11,94,168,.18)}.dayh.today::after{content:'今日';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#0b5ea8;color:#fff;border-radius:999px;padding:2px 6px;font-size:8px;line-height:1;font-weight:950;white-space:nowrap}.dayh.today .date{color:#0b5ea8}.dayh.sat{background:#edf6ff;color:#195f99;border-color:#9fc8e8}.dayh.sat .date{color:#3976a8}.dayh.sun{background:#fff0f0;color:#a12626;border-color:#dfaaaa}.dayh.sun .date{color:#a84a4a}

.list{padding:3px 8px 80px;display:flex;flex-direction:column;gap:7px}.person{background:#fff;border:1px solid #d8e1e6;border-radius:14px;box-shadow:var(--shadow);padding:7px 7px 8px}.person.dirty{outline:2px solid #f1bb55;outline-offset:-2px}.person-name{font-size:16px;font-weight:950;padding:0 2px 6px;display:flex;align-items:center;gap:6px}.weekcells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.daycell{min-width:0;height:88px;border:1px solid #d5dfe5;border-radius:9px;background-color:#f8fafb;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.daycell:active{transform:scale(.97)}.cell-status{font-size:10px;font-weight:950;line-height:1.05;white-space:pre-line}.cell-time{font-size:11px;font-weight:950;margin-top:4px;color:#23333e}.daycell.blank .cell-status{color:#9aa6ad;font-size:16px}.daycell.internal{background-color:#eaf4ff;border-color:#afcfe9;color:#0c527f}.daycell.outing{background-color:#eef7e8;border-color:#b9d7aa;color:#35611f}.daycell.direct{background-color:#e7f7f8;border-color:#a5d3d7;color:#0c6672}.daycell.trip{background-color:#fff5dc;border-color:#e5c983;color:#775000}.daycell.off{background-color:#fff0f0;border-color:#e2b2b2;color:#8c2020}.daycell.noreturn .cell-time{color:#8b3131}.daycell.today-col{border-left:3px solid #0b5ea8;border-right:3px solid #0b5ea8;background-image:linear-gradient(rgba(11,94,168,.105),rgba(11,94,168,.105));box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}.person:first-child .daycell.today-col{border-top:3px solid #0b5ea8}.person:last-child .daycell.today-col{border-bottom:3px solid #0b5ea8}
.empty{padding:28px 16px;text-align:center;color:#6b7880;background:#fff;border-radius:14px;border:1px solid #d8e0e5}.modal{position:fixed;inset:0;z-index:80;background:rgba(10,25,38,.55);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;background:#fff;border-radius:20px 20px 0 0;padding:13px 13px calc(13px + env(safe-area-inset-bottom));overflow:auto}.sheetbar{width:42px;height:5px;border-radius:99px;background:#ccd4d9;margin:0 auto 10px}.sheet h2{margin:0;font-size:20px}.sheetdate{font-size:13px;color:var(--muted);font-weight:850;margin:3px 0 12px}.section-label{font-size:12px;font-weight:950;color:#53646f;margin:10px 0 6px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.edit-status{position:relative;height:48px;border:1px solid #c6d1d8;background:#fff;border-radius:12px;font-size:15px;font-weight:950}.edit-status.active::after{content:attr(data-order);position:absolute;right:5px;top:5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#fff;color:#164e75;font-size:11px;line-height:18px;text-align:center;font-weight:950}.edit-status[data-v="休み"].active::after{color:var(--danger)}.edit-status[data-v="出張"].active::after{color:var(--trip)}.edit-status.active{background:#164e75;color:#fff;border-color:#164e75}.edit-status[data-v="外出"].active{background:#4d7f32;border-color:#4d7f32}.edit-status[data-v="出張"].active{background:var(--trip);border-color:var(--trip)}.edit-status[data-v="休み"].active{background:var(--danger);border-color:var(--danger)}.edit-status[data-v="午前休"].active,.edit-status[data-v="午後休"].active{background:#9b4d7a;border-color:#9b4d7a}
.select-wrap{position:relative}.select-wrap:after{content:'▼';position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:#566873;font-size:13px}.return-select{width:100%;height:54px;border:1px solid #b9c7cf;background:#fff;border-radius:12px;padding:0 42px 0 14px;font-size:18px;font-weight:950;color:#162630;appearance:none;-webkit-appearance:none}.return-select.none{background:#fff4f4;color:#8b2020}.edit-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.donebtn,.clearbtn{height:49px;border-radius:12px;font-weight:950;font-size:16px}.donebtn{border:0;background:var(--accent);color:#fff}.clearbtn{border:1px solid #d8b4b4;background:#fff;color:var(--danger)}
.personedit{display:flex;gap:6px;align-items:center;margin:7px 0}.personedit input{flex:1;min-width:0;height:42px;border:1px solid #c5d0d7;border-radius:10px;padding:0 10px;font-size:16px}.smallbtn{height:42px;border:1px solid #c5d0d7;background:#fff;border-radius:10px;padding:0 11px;font-weight:900}.smallbtn.danger{color:var(--danger);border-color:#e4b8b4}.sheetactions{display:flex;gap:7px;position:sticky;bottom:0;background:#fff;padding-top:9px}.sheetactions button{flex:1;height:45px;border-radius:11px;border:1px solid #bfcbd2;background:#fff;font-weight:950}.sheetactions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.lock{position:fixed;inset:0;z-index:70;background:rgba(238,242,245,.86);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:950;color:#384852}body.sync-locked .lock{display:flex}body.sync-locked .list{pointer-events:none;opacity:.55}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:#17324d;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s;max-width:92vw;text-align:center}.toast.show{opacity:1}
body.pc-view #app{max-width:1440px;padding:0 12px}body.pc-view .top{padding-left:14px;padding-right:14px}body.pc-view .brand-logo{width:155px}body.pc-view .appname{font-size:23px}body.pc-view .dayhead{display:grid;grid-template-columns:158px minmax(0,1fr);gap:0;padding-left:12px;padding-right:12px}body.pc-view .dayhead-spacer{display:block}body.pc-view .dayhead-days{gap:6px;padding-left:8px;padding-right:8px}body.pc-view .list{padding-left:12px;padding-right:12px;gap:5px}body.pc-view .person{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:stretch;padding:5px 7px}body.pc-view .person-name{font-size:18px;padding:0 12px 0 4px;align-items:center;border-right:1px solid #e1e7eb}body.pc-view .weekcells{gap:6px;padding-left:8px}body.pc-view .daycell{height:66px;border-radius:8px}body.pc-view .cell-status{font-size:12px;line-height:1.1}body.pc-view .cell-time{font-size:13px;margin-top:2px}body.pc-view .dayh{min-height:48px;padding-top:5px;padding-bottom:4px}body.pc-view .dayh .weekday{font-size:19px}body.pc-view .dayh .date{margin-top:4px}body.pc-view .sheet{width:min(920px,96vw);border-radius:18px;margin:auto}body.pc-view .modal{align-items:center;padding:20px}body.pc-view .status-grid{grid-template-columns:repeat(4,1fr)}
@media(min-width:620px){.brand-logo{width:145px}.appname{font-size:20px}.daycell{height:84px}.cell-status{font-size:12px}.cell-time{font-size:13px}.person-name{font-size:18px}}
</style>
</head>

function normalize(v){const s=v&&typeof v==='object'?v:defaultState();if(!Array.isArray(s.people))s.people=[];if(!s.weeks||typeof s.weeks!=='object'||Array.isArray(s.weeks))s.weeks={};s.schema='hjp_weekly_v4';for(const w of Object.values(s.weeks))for(const d of Object.values(w?.days||{}))for(const e of Object.values(d?.entries||{}))normalizeEntry(e);return s}

function normalizeEntry(e){if(!e||typeof e!=='object')e={};let statuses=Array.isArray(e.statuses)?e.statuses.map(String):[];if(!statuses.length&&e.status){const old=String(e.status);if(old==='直行/直帰')statuses=['直行','直帰'];else if(STATUS.includes(old))statuses=[old]}statuses=[...new Set(statuses.filter(x=>STATUS.includes(x)))];if(statuses.includes('休み'))statuses=['休み'];e.statuses=statuses;e.returnTime=normalizeHour(e.returnTime??e.time??'');const last=e.statuses[e.statuses.length-1]||'';const noTime=e.statuses.includes('休み')||last==='直帰'||last==='午後休'||(e.statuses.length===1&&(last==='社内'||last==='午前休'||last==='午後休'));if(noTime)e.returnTime=(last==='直帰'||last==='午後休'||e.statuses.includes('休み'))?'帰社なし':'';else if(e.returnTime==='帰社なし')e.returnTime='';delete e.status;delete e.schedule;delete e.time;delete e.note;return e}
function getClientId(){const k='hjp_weekly_client_id';let id=localStorage.getItem(k);if(!id){id='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem(k,id)}return id}
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function toDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}`}function weekKeyForDate(k){return toDateKey(startOfWeek(fromKey(k)))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ensureWeekFor(dateKey){const k=weekKeyForDate(dateKey);if(!state.weeks[k])state.weeks[k]={days:{}};return state.weeks[k]}function entry(dateKey,pid){const w=ensureWeekFor(dateKey);if(!w.days[dateKey])w.days[dateKey]={entries:{}};if(!w.days[dateKey].entries)w.days[dateKey].entries={};if(!w.days[dateKey].entries[pid])w.days[dateKey].entries[pid]={statuses:[],returnTime:'',updatedAt:0,updatedBy:''};return normalizeEntry(w.days[dateKey].entries[pid])}function safeEntry(dateKey,pid){const e=state.weeks?.[weekKeyForDate(dateKey)]?.days?.[dateKey]?.entries?.[pid];return normalizeEntry(e?JSON.parse(JSON.stringify(e)):{statuses:[],returnTime:''})}
function statusLabel(a){if(!a?.length)return '＋';return a.join('\n')}function cellClass(e){if(e.statuses.includes('休み'))return 'off';if(e.statuses.includes('出張'))return 'trip';if(e.statuses.includes('社内'))return 'internal';if(e.statuses.includes('外出'))return 'outing';if(e.statuses.length)return 'direct';return 'blank'}function timeLabel(e){if(e.returnTime==='帰社なし')return '';if(/^\d{2}:00$/.test(e.returnTime))return Number(e.returnTime.slice(0,2))+'時';return ''}
function renderDayHead(){const names=['月','火','水','木','金','土','日'],today=toDateKey(new Date());dayHead.innerHTML='<div class="dayhead-spacer" aria-hidden="true"></div><div class="dayhead-days"></div>';const daysWrap=dayHead.querySelector('.dayhead-days');for(let i=0;i<7;i++){const d=addDays(weekStart,i),k=toDateKey(d),el=document.createElement('div');el.className='dayh'+(k===today?' today':'')+(i===5?' sat':'')+(i===6?' sun':'');el.innerHTML=`<span class="weekday">${names[i]}</span><span class="date">${fmtDate(d)}</span>`;daysWrap.appendChild(el)}}
function render(){state=normalize(state);const end=addDays(weekStart,6);$('#weekLabel').textContent=`${weekStart.getFullYear()}年 ${fmtDate(weekStart)} ～ ${fmtDate(end)}`;renderDayHead();renderList()}
function renderList(){list.innerHTML='';const people=state.people.filter(p=>!p.deleted).sort((a,b)=>(a.order??0)-(b.order??0)),today=toDateKey(new Date());if(!people.length){list.innerHTML='<div class="empty">メンバーが未登録です。</div>';return}people.forEach(p=>{const card=document.createElement('section');card.className='person';card.dataset.personId=p.id;const cells=[];for(let i=0;i<7;i++){const d=addDays(weekStart,i),k=toDateKey(d),e=safeEntry(k,p.id),cl=cellClass(e),tl=timeLabel(e),todayClass=k===today?'today-col':'';cells.push(`<button class="daycell ${cl} ${e.returnTime==='帰社なし'?'noreturn':''} ${todayClass}" data-date="${k}" aria-label="${esc(p.name)} ${fmtDate(d)}"><span class="cell-status">${esc(statusLabel(e.statuses))}</span><span class="cell-time">${esc(tl)}</span></button>`)}card.innerHTML=`<div class="person-name">${esc(p.name)}</div><div class="weekcells">${cells.join('')}</div>`;card.querySelectorAll('.daycell').forEach(b=>b.onclick=()=>openEntry(p.id,b.dataset.date));list.appendChild(card)})}
function addPatch(dateKey,pid,field,value,card=null){const e=entry(dateKey,pid);e[field]=Array.isArray(value)?[...value]:value;e.updatedAt=Date.now();e.updatedBy=clientId;pendingPatches.push({type:'field',weekKey:weekKeyForDate(dateKey),date:dateKey,personId:pid,field,value:Array.isArray(value)?[...value]:value,ts:e.updatedAt,clientId});if(card)card.classList.add('dirty');queueSave()}
function setEntryField(dateKey,pid,field,value){addPatch(dateKey,pid,field,value);render()}
function buildReturnOptions(){const s=$('#returnSelect');s.innerHTML='<option value="">未設定</option>';for(let h=7;h<=23;h++){const v=String(h).padStart(2,'0')+':00',o=document.createElement('option');o.value=v;o.textContent=h+'時';s.appendChild(o)}const none=document.createElement('option');none.value='帰社なし';none.textContent='帰社なし';s.appendChild(none)}buildReturnOptions();
function openEntry(pid,dateKey){const p=state.people.find(x=>x.id===pid);if(!p)return;editing={pid,dateKey};$('#editPersonName').textContent=p.name;const d=fromKey(dateKey),names=['日','月','火','水','木','金','土'];$('#editDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${names[d.getDay()]}）`;renderEdit();editModal.classList.add('show')}
function renderEdit(){if(!editing)return;const e=safeEntry(editing.dateKey,editing.pid),g=$('#editStatusGrid');g.innerHTML=STATUS.map(v=>{const idx=e.statuses.indexOf(v);return `<button class="edit-status ${idx>=0?'active':''}" data-v="${v}" data-order="${idx>=0?idx+1:''}">${v}</button>`}).join('');g.querySelectorAll('.edit-status').forEach(b=>b.onclick=()=>toggleEditStatus(b.dataset.v));const sel=$('#returnSelect');sel.value=e.returnTime||'';const last=e.statuses[e.statuses.length-1]||'';const noTime=e.statuses.includes('休み')||last==='直帰'||last==='午後休'||(e.statuses.length===1&&(last==='社内'||last==='午前休'||last==='午後休'));$('#returnSection').style.display=noTime?'none':'';sel.disabled=noTime;sel.classList.toggle('none',e.returnTime==='帰社なし');}
function toggleEditStatus(val){const e=entry(editing.dateKey,editing.pid);let a=[...e.statuses];if(val==='休み'){a=a.length===1&&a[0]==='休み'?[]:['休み'];}else{a=a.filter(x=>x!=='休み');if(a.includes(val))a=a.filter(x=>x!==val);else a.push(val);}e.statuses=a;const last=a[a.length-1]||'';const noTime=a.includes('休み')||last==='直帰'||last==='午後休'||(a.length===1&&(last==='社内'||last==='午前休'||last==='午後休'));if(noTime)e.returnTime=(last==='直帰'||last==='午後休'||a.includes('休み'))?'帰社なし':'';else if(e.returnTime==='帰社なし')e.returnTime='';addPatch(editing.dateKey,editing.pid,'statuses',a);addPatch(editing.dateKey,editing.pid,'returnTime',e.returnTime);render();renderEdit()}
$('#returnSelect').addEventListener('change',e=>{if(!editing)return;setEntryField(editing.dateKey,editing.pid,'returnTime',e.target.value);renderEdit()});
$('#clearEdit').onclick=()=>{if(!editing)return;const e=entry(editing.dateKey,editing.pid);e.statuses=[];e.returnTime='';addPatch(editing.dateKey,editing.pid,'statuses',[]);addPatch(editing.dateKey,editing.pid,'returnTime','');render();renderEdit();toast('入力をクリアしました')};
$('#closeEdit').onclick=()=>editModal.classList.remove('show');editModal.addEventListener('click',e=>{if(e.target===editModal)editModal.classList.remove('show')});
function compact(){return JSON.parse(JSON.stringify(normalize(state)))}function setSync(type,text){syncBadge.className='sync '+type;syncBadge.textContent=text}function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function isGasConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(GAS_URL)}function queueSave(ms=SAVE_DELAY){clearTimeout(saveTimer);saveTimer=setTimeout(saveRemote,ms)}
function jsonp(params,timeout=REQUEST_TIMEOUT_MS){return new Promise((resolve,reject)=>{if(!isGasConfigured())return reject(new Error('GAS_URL_NOT_CONFIGURED'));const cb='__hjp_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('timeout')),timeout);function finish(err,data){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){}s.remove();err?reject(err):resolve(data)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('network'));s.src=GAS_URL+(GAS_URL.includes('?')?'&':'?')+new URLSearchParams({...params,token:API_TOKEN,callback:cb,_:Date.now()});document.head.appendChild(s)})}function post(fields){return new Promise((resolve,reject)=>{if(!isGasConfigured())return reject(new Error('GAS_URL_NOT_CONFIGURED'));const n='f_'+Date.now(),i=document.createElement('iframe'),f=document.createElement('form');i.name=n;i.style.display='none';f.method='POST';f.action=GAS_URL;f.target=n;f.style.display='none';Object.entries(fields).forEach(([k,v])=>{const x=document.createElement('input');x.type='hidden';x.name=k;x.value=String(v??'');f.appendChild(x)});document.body.append(i,f);try{f.submit();setTimeout(resolve,80)}catch(e){reject(e)}setTimeout(()=>{f.remove();i.remove()},22000)})}async function waitAck(id){const until=Date.now()+9000;await new Promise(r=>setTimeout(r,ACK_POLL_MS));while(Date.now()<until){try{const r=await jsonp({action:'ack',requestId:id,generation:generationId},4500);if(r&&!r.pending)return r}catch(_){}await new Promise(r=>setTimeout(r,ACK_POLL_MS))}return null}
function applyPatches(target,patches){target=normalize(target);for(const p of patches){if(p.type==='field'){if(!target.weeks[p.weekKey])target.weeks[p.weekKey]={days:{}};const w=target.weeks[p.weekKey];if(!w.days[p.date])w.days[p.date]={entries:{}};if(!w.days[p.date].entries)w.days[p.date].entries={};if(!w.days[p.date].entries[p.personId])w.days[p.date].entries[p.personId]={statuses:[],returnTime:'',updatedAt:0,updatedBy:''};const e=normalizeEntry(w.days[p.date].entries[p.personId]);e[p.field]=Array.isArray(p.value)?[...p.value]:p.value;e.updatedAt=Math.max(Number(e.updatedAt||0),Number(p.ts||0));e.updatedBy=p.clientId||''}else if(p.type==='people')target.people=JSON.parse(JSON.stringify(p.people))}return target}
async function saveRemote(){if(!remoteReady||saveInFlight||!pendingPatches.length)return;if(!isGasConfigured()){setSync('error','URL未設定');return}saveInFlight=true;const patches=pendingPatches.slice(),requestId=clientId+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);setSync('saving','保存中');try{const payload=JSON.stringify(compact());await post({action:'save',token:API_TOKEN,requestId,clientId,revision,generation:generationId,payload});let ack=await waitAck(requestId);if(ack?.conflict){const r=await jsonp({action:'load',since:-1,generation:generationId,verify:'1'});if(!r?.ok)throw new Error('conflict_reload_failed');state=applyPatches(r.state||defaultState(),pendingPatches);revision=Number(r.revision||0);generationId=String(r.generationId||generationId);saveInFlight=false;render();queueSave(100);return}if(ack?.generationMismatch){pendingPatches=[];saveInFlight=false;await loadRemote({initial:true});toast('最新状態を読み直しました');return}if(!ack?.ok)throw new Error(ack?.error||'save_unconfirmed');revision=Number(ack.revision||revision+1);const saved=new Set(patches.map(p=>JSON.stringify(p)));pendingPatches=pendingPatches.filter(p=>!saved.has(JSON.stringify(p)));setSync(pendingPatches.length?'saving':'ok',pendingPatches.length?'未同期':'同期済み')}catch(e){console.error(e);setSync('error','再試行');setTimeout(()=>queueSave(100),1800)}finally{saveInFlight=false}}
async function loadRemote({initial=false}={}){if(loadInFlight||saveInFlight||pendingPatches.length)return;if(!isGasConfigured()){setSync('error','GAS URL未設定');return}loadInFlight=true;if(initial)setSync('loading','接続中');try{const r=await jsonp({action:'load',since:initial?-1:revision,generation:generationId,verify:initial?'1':'0'});if(!r?.ok)throw new Error(r?.error||'load_failed');if(r.notModified){remoteReady=true;document.body.classList.remove('sync-locked');setSync('ok','同期済み');return}state=normalize(r.state||defaultState());revision=Number(r.revision||0);generationId=String(r.generationId||'');remoteReady=true;document.body.classList.remove('sync-locked');setSync('ok','同期済み');render();if(editModal.classList.contains('show'))renderEdit()}catch(e){console.error(e);setSync('error','接続待ち');if(initial)document.body.classList.add('sync-locked')}finally{loadInFlight=false}}
function shiftWeek(n){weekStart=addDays(weekStart,n*7);render();loadRemote()}$('#prevWeek').onclick=()=>shiftWeek(-1);$('#nextWeek').onclick=()=>shiftWeek(1);$('#todayWeek').onclick=()=>{weekStart=startOfWeek(new Date());render()};

function openPeople(){peopleEditor.innerHTML='';state.people.filter(p=>!p.deleted).sort((a,b)=>(a.order??0)-(b.order??0)).forEach(p=>addPersonEditor(p.name,p.id));peopleModal.classList.add('show')}function addPersonEditor(name='',id=''){const row=document.createElement('div');row.className='personedit';row.dataset.id=id;row.innerHTML=`<input value="${esc(name)}" maxlength="16" placeholder="氏名"><button class="smallbtn danger">削除</button>`;row.querySelector('button').onclick=()=>row.remove();peopleEditor.appendChild(row)}$('#peopleBtn').onclick=openPeople;$('#closePeople').onclick=()=>peopleModal.classList.remove('show');$('#addPerson').onclick=()=>addPersonEditor();peopleModal.addEventListener('click',e=>{if(e.target===peopleModal)peopleModal.classList.remove('show')});$('#savePeople').onclick=()=>{const rows=[...peopleEditor.querySelectorAll('.personedit')],next=[];rows.forEach((r,i)=>{const name=r.querySelector('input').value.trim();if(!name)return;let id=r.dataset.id;if(!id)id='p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);next.push({id,name,order:i,updatedAt:Date.now()})});state.people=next;pendingPatches=pendingPatches.filter(p=>p.type!=='people');pendingPatches.push({type:'people',people:JSON.parse(JSON.stringify(next)),ts:Date.now()});peopleModal.classList.remove('show');render();queueSave(80)};

async function togglePcView(){
  const enable=!document.body.classList.contains('pc-view');
  document.body.classList.toggle('pc-view',enable);
  viewBtn?.classList.toggle('active',enable);
  viewBtn?.setAttribute('aria-pressed',enable?'true':'false');
  try{
    if(enable && !document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if(!enable && document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
  }catch(e){}
}
viewBtn?.addEventListener('click',togglePcView);
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('pc-view')){
    document.body.classList.remove('pc-view');
    viewBtn?.classList.remove('active');
    viewBtn?.setAttribute('aria-pressed','false');
  }
});

syncBadge.onclick=()=>pendingPatches.length?queueSave(50):loadRemote({initial:true});render();setTimeout(()=>loadRemote({initial:true}),50);setInterval(()=>loadRemote(),POLL_MS);
})();
</script>
