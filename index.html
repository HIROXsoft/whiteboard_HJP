<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#eef3f6" />
<title>デジタル スケジュールボード</title>
<style>
  :root{
    --bg:#eaf0f3;
    --board:#f8fbfc;
    --line:#8d9aa1;
    --line-strong:#45545c;
    --ink:#101820;
    --panel:#ffffffee;
    --accent:#0f6cbd;
    --shadow:0 8px 24px rgba(0,0,0,.12);
    --row-h:92px;
    --header-h:58px;
    --name-magnet-w:clamp(82px,8vw,112px);
    --name-magnet-h:50px;
    --status-magnet-w:clamp(70px,6.5vw,92px);
    --status-magnet-h:54px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);overflow:hidden}
  button,input{font:inherit}
  button{touch-action:manipulation}
  #app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);z-index:30}
  .brand-logo{display:block;width:clamp(112px,13vw,190px);height:auto;flex:0 0 auto;object-fit:contain}
  .title{font-size:clamp(20px,2.6vw,38px);font-weight:900;letter-spacing:.04em;white-space:nowrap}
  .datebox{display:flex;align-items:center;gap:6px;margin-right:auto}
  .datebox input{font-size:clamp(17px,2vw,28px);font-weight:800;border:1px solid #b7c3ca;border-radius:10px;padding:7px 9px;background:#fff}
  .tool-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
  .btn{border:1px solid #aab6bd;background:#fff;border-radius:10px;padding:7px 10px;font-weight:850;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;min-height:40px;white-space:nowrap}
  .btn.active{background:#102a43;color:#fff;border-color:#102a43}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{background:#fff2f2;color:#9c1818;border-color:#e0abab}
  .layout{min-height:0;flex:1;display:grid;grid-template-columns:clamp(145px,14vw,180px) minmax(0,1fr);gap:6px}
  .tray{min-height:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .tray-head{padding:7px 6px;border-bottom:1px solid #cbd5da;font-weight:900;font-size:15px;text-align:center}
  .tray-actions{padding:5px;display:grid;grid-template-columns:1fr;gap:4px;border-bottom:1px solid #d5dde1}
  .tray .btn{min-height:36px;padding:5px 4px;border-radius:8px;font-size:13px}
  .tray-list{min-height:0;overflow:auto;padding:5px;display:flex;flex-direction:column;gap:5px}
  .person-card{display:grid;grid-template-columns:1fr auto;gap:3px;align-items:center}
  .name-chip,.status-chip{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;border-radius:8px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.18)}
  .name-chip{background:linear-gradient(#fff,#edf2f5);width:var(--name-magnet-w);height:var(--name-magnet-h);min-width:var(--name-magnet-w);min-height:var(--name-magnet-h);padding:7px 8px;font-size:clamp(17px,1.7vw,25px);letter-spacing:.08em;white-space:nowrap;flex:none}
  .status-chip{width:var(--status-magnet-w);height:var(--status-magnet-h);min-width:var(--status-magnet-w);min-height:var(--status-magnet-h);padding:9px 8px;font-size:clamp(16px,1.5vw,22px);color:#111;font-weight:900;white-space:nowrap;flex:none}
  .status-direct,.status-return{background:#8fc6ff}
  .status-trip{background:#ffe26a}
  .status-floor{background:linear-gradient(#dff7df,#a9dda9);border-color:#5f9f68;color:#153f1c}
  .name-chip:hover,.status-chip:hover,.floating-chip:hover{filter:brightness(.98);box-shadow:0 6px 14px rgba(0,0,0,.22)}
  .tiny{border:0;background:transparent;font-size:16px;padding:4px;cursor:pointer}
  .magnet-box{padding:5px;border-top:1px solid #cbd5da;display:flex;flex-direction:column;align-items:center;gap:5px}
  .floor-picker{width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:2px}
  .floor-picker-toggle{width:var(--status-magnet-w);min-height:42px;border:2px solid #5f9f68;border-radius:9px;background:linear-gradient(#f4fff4,#d6efd8);color:#194b20;font-weight:950;font-size:14px;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 8px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;gap:4px}
  .floor-picker-toggle::after{content:'▼';font-size:11px;transition:transform .15s}
  .floor-picker.open .floor-picker-toggle::after{transform:rotate(180deg)}
  .floor-picker-toggle:active{transform:scale(.97)}
  .floor-options{display:none;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:6px;border:1px solid #a8c8ad;border-radius:10px;background:#f3fbf4;box-shadow:0 5px 14px rgba(0,0,0,.14)}
  .floor-picker.open .floor-options{display:grid}
  .floor-options .status-chip{width:100%;min-width:0;height:46px;min-height:46px;font-size:18px}
  .floor-options .status-chip:last-child{grid-column:1 / -1;width:50%;justify-self:center}
  .floor-hint{font-size:11px;font-weight:800;color:#52705a;text-align:center;line-height:1.25}
  .board-wrap{min-width:0;min-height:0;background:var(--board);border-radius:14px;box-shadow:var(--shadow);overflow:auto;position:relative}
  .board{min-width:760px;padding:10px 14px 18px}
  .board-title{position:relative;border-bottom:3px solid var(--line-strong);padding:4px 8px 8px;background:var(--board);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .16s,border-color .16s,color .16s,box-shadow .16s}
  .board-title .main{text-align:center;font-weight:950;font-size:clamp(24px,3vw,42px);letter-spacing:.06em}
  .board-title::after{content:"上部中央の消しゴム、または見出しをタップして切替";display:block;text-align:center;margin-top:1px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#66757d}
  .board-title.erase-mode{background:#fff0d8;border-color:#e06c00;color:#9a3f00;box-shadow:inset 0 0 0 3px rgba(224,108,0,.2)}
  .board-title.erase-mode::after{content:"消しゴム使用中｜見出しまたは消しゴムをタップして手書きへ戻る";color:#b34700}

  .eraser-mode-mark{position:relative;flex:0 0 auto;width:132px;height:54px;margin-left:18px;margin-right:auto;border:3px solid #9a3f00;border-radius:12px;background:linear-gradient(to bottom,#ffd28a 0 45%,#343b40 45% 100%);box-shadow:0 4px 12px rgba(0,0,0,.28),0 0 0 5px rgba(255,138,31,.16);display:flex;align-items:flex-start;justify-content:center;padding-top:4px;color:#6f2c00;font-size:16px;font-weight:950;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;z-index:4;transition:transform .12s,box-shadow .12s,outline-color .12s}
  .eraser-mode-mark::before{content:"タップで切替";position:absolute;left:0;right:0;top:-17px;text-align:center;color:#9a3f00;font-size:11px;line-height:1;font-weight:950;white-space:nowrap}
  .eraser-mode-mark::after{content:"消しゴム";position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#fff;font-size:15px;line-height:1;font-weight:950;text-shadow:0 1px 2px rgba(0,0,0,.65)}
  .eraser-mode-mark:active{transform:scale(.95)}
  .eraser-mode-mark.active{outline:5px solid #ff7a00;outline-offset:3px;background:linear-gradient(to bottom,#ffbd54 0 45%,#d85b00 45% 100%);box-shadow:0 0 0 9px rgba(255,122,0,.24),0 5px 16px rgba(0,0,0,.34)}
  .eraser-mode-mark.active::before{content:"消しゴム使用中";color:#c34700}
  .board-surface{position:relative}
  .headers{display:grid;grid-template-columns:20% 1fr 18%;background:var(--board);border-bottom:2px solid var(--line-strong);font-size:clamp(16px,1.7vw,25px);font-weight:900;text-align:center;min-height:var(--header-h)}
  .headers>div{padding:8px 4px;border-right:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center}
  .headers>div:last-child{border-right:0}
  .rows{position:relative}
  .row{display:grid;grid-template-columns:20% 1fr 18%;min-height:var(--row-h);border-bottom:1.5px solid var(--line);position:relative;background:#fbfdfe}
  .cell{position:relative;border-right:2px solid var(--line-strong);min-height:var(--row-h)}
  .cell:last-child{border-right:0}
  .drawing-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:6;touch-action:none;pointer-events:auto}
  .floating-layer{position:absolute;inset:0;z-index:12;pointer-events:none}
  .floating-chip{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
  .ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;transform:scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.28)}
  .empty{color:#78868e;font-size:14px;padding:8px}
  .modal{position:fixed;inset:0;background:#0d1b2a88;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.show{display:flex}
  .dialog{width:min(560px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:18px}
  .dialog h2{margin:0 0 14px}
  .field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
  .field input{font-size:20px;padding:10px;border:1px solid #adb9c0;border-radius:9px}
  .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#132f4c;color:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:.2s}
  .toast.show{opacity:1}
  .sync-badge{display:inline-flex;align-items:center;justify-content:center;min-width:84px;min-height:36px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap;border:1px solid #b6c2c8;background:#f3f6f8;color:#33434c}
  .sync-badge.ok{background:#e8f7ec;color:#176b32;border-color:#9dd4aa}
  .sync-badge.saving,.sync-badge.loading{background:#fff7d6;color:#765b00;border-color:#ddc86b}
  .sync-badge.error{background:#fff0f0;color:#a11d1d;border-color:#e2aaaa}
  .board-surface .drawing-canvas{cursor:crosshair}
  .board-surface.erase-mode{outline:4px solid rgba(224,108,0,.62);outline-offset:-4px}
  .board-surface.erase-mode .drawing-canvas{cursor:none}
  .mode-banner{display:none;position:sticky;top:0;left:0;right:0;z-index:18;margin:0 auto;width:max-content;max-width:calc(100% - 24px);padding:7px 16px;border-radius:0 0 12px 12px;background:#d85b00;color:#fff;font-size:14px;font-weight:950;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.22);pointer-events:none}
  .mode-banner.show{display:block}
  .eraser-cursor{display:none;position:absolute;z-index:17;width:58px;height:58px;border:3px solid #e05f00;border-radius:50%;background:rgba(255,145,42,.17);box-shadow:0 0 0 3px rgba(255,255,255,.86),0 3px 10px rgba(0,0,0,.2);pointer-events:none;transform:translate(-50%,-50%)}
  .eraser-cursor.show{display:block}
  .mobile-view-badge{display:none;align-items:center;justify-content:center;min-height:36px;padding:6px 10px;border-radius:999px;background:#e8f3ff;color:#155a91;border:1px solid #8bb9df;font-size:13px;font-weight:950;white-space:nowrap}
  body.mobile-view-only .mobile-view-badge{display:inline-flex}
  body.mobile-view-only .eraser-mode-mark,
  body.mobile-view-only #undoBtn,
  body.mobile-view-only #clearDrawingBtn,
  body.mobile-view-only .tray,
  body.mobile-view-only .tiny{display:none!important}
  body.mobile-view-only #app{gap:5px;padding:5px}
  body.mobile-view-only .topbar{min-height:48px;padding:5px 7px;border-radius:10px;gap:5px;flex-wrap:nowrap}
  body.mobile-view-only .topbar>.title{display:none!important}
  body.mobile-view-only .brand-logo{width:110px;max-height:32px}
  body.mobile-view-only .tool-group{width:100%;display:flex;justify-content:flex-end;gap:5px;flex-wrap:nowrap}
  body.mobile-view-only .mobile-view-badge{margin-right:auto;min-height:34px;padding:5px 9px;font-size:12px}
  body.mobile-view-only .sync-badge{min-width:64px;min-height:34px;padding:5px 7px;font-size:11px}
  body.mobile-view-only #fullBtn{min-height:34px;padding:5px 8px;font-size:0;border-radius:8px}
  body.mobile-view-only #fullBtn::before{content:"⛶";font-size:21px;line-height:1}
  body.mobile-view-only .layout{display:block;min-height:0;width:100%}
  body.mobile-view-only .board-wrap{width:100%;height:100%;border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:thin}
  body.mobile-view-only .board{min-width:820px;padding:5px 7px 14px}
  body.mobile-view-only .board-title{cursor:default;touch-action:auto;padding:2px 4px 6px}
  body.mobile-view-only .board-title .main{font-size:25px}
  body.mobile-view-only .board-title::after{content:"閲覧専用｜指で上下左右に移動";display:block;font-size:12px;padding-top:3px}
  body.mobile-view-only .headers{font-size:17px;min-height:48px}
  body.mobile-view-only .drawing-canvas{pointer-events:none!important;touch-action:auto!important;cursor:default!important}
  body.mobile-view-only .floating-chip{pointer-events:none!important;touch-action:auto!important;cursor:default!important}
  body.mobile-view-only .mode-banner,
  body.mobile-view-only .eraser-cursor{display:none!important}
  @media (orientation:landscape){
    body.mobile-view-only #app{padding:3px}
    body.mobile-view-only .topbar{min-height:42px;padding:3px 6px}
    body.mobile-view-only .mobile-view-badge,
    body.mobile-view-only .sync-badge{min-height:30px}
    body.mobile-view-only #fullBtn{min-height:30px}
    body.mobile-view-only .board{min-width:900px}
    body.mobile-view-only .board-title .main{font-size:22px}
  }
  @media (max-width:900px){
    .brand-logo{width:104px}
    .layout{grid-template-columns:140px minmax(0,1fr)}
    .title{font-size:clamp(17px,3.5vw,24px)}
    .topbar{align-items:center;gap:6px}
    .eraser-mode-mark{width:112px;height:48px;margin-left:8px;font-size:14px}
    .tool-group{gap:4px}
    .sync-badge{min-width:70px;padding:5px 7px;font-size:12px}
    .tool-group{gap:4px}
    .btn{padding:7px 8px}
  }

  body.sync-locked .tray,
  body.sync-locked .drawing-canvas,
  body.sync-locked .floating-chip,
  body.sync-locked #undoBtn,
  body.sync-locked #clearDrawingBtn,
  body.sync-locked #addPersonBtn,
  body.sync-locked #resetPeopleBtn,
  body.sync-locked .eraser-mode-mark,
  body.sync-locked .board-title{pointer-events:none!important;}
  body.sync-locked .tray, body.sync-locked .board-surface{opacity:.72;}
</style>
</head>

  function normalizeState(value){

    if('drawing' in b) delete b.drawing;

  // v9: サーバーを唯一の正本とする。過去のブラウザ状態は同期に一切使用しない。
  function purgePersistentSyncStorage(){
    try{
      const removeKeys=[];
      for(let i=0;i<localStorage.length;i++){
        const key=localStorage.key(i);
        if(!key) continue;
        if(key==='hirox_hjp_schedule_board_client_id') continue;
        if(key.startsWith('hirox_hjp_schedule_board_')) removeKeys.push(key);
      }
      removeKeys.forEach(key=>localStorage.removeItem(key));
    }catch(e){ console.warn('旧同期キャッシュの削除に失敗しました。',e); }
  }

  function clamp01(value){
    return Math.max(0, Math.min(1, Number(value) || 0));
  }

  function coordinateModeOf(m){
    return m && m.coordinateMode === 'centerRatio' ? 'centerRatio' :
      (m && m.coordinateMode === 'boardRatio' ? 'boardRatio' :
      (m && m.coordinateMode === 'ratio' ? 'legacyRatio' : 'pixel'));
  }

  /*
   * centerRatio はマグネットの中心位置をボード全体に対する比率で保持します。
   * 全画面切替でマグネットの表示幅が変わっても中心が動かないため、
   * 手書きとの位置関係を安定して維持できます。
   */
  function magnetDisplayPosition(m, el, boardRectOverride=null){
    const boardRect = boardRectOverride || boardSurface.getBoundingClientRect();
    const width = el ? el.offsetWidth : 0;
    const height = el ? el.offsetHeight : 0;
    const maxX = Math.max(0, boardRect.width - width);
    const maxY = Math.max(0, boardRect.height - height);
    const mode = coordinateModeOf(m);
    let x;
    let y;
    if(mode === 'centerRatio'){
      x = clamp01(m.x) * boardRect.width - width / 2;
      y = clamp01(m.y) * boardRect.height - height / 2;
    }else if(mode === 'boardRatio'){
      x = clamp01(m.x) * boardRect.width;
      y = clamp01(m.y) * boardRect.height;
    }else if(mode === 'legacyRatio'){
      x = clamp01(m.x) * maxX;
      y = clamp01(m.y) * maxY;
    }else{
      x = Number(m.x) || 0;
      y = Number(m.y) || 0;
    }
    return {x:Math.max(0, Math.min(x, maxX)), y:Math.max(0, Math.min(y, maxY))};
  }

  function migrateMagnetsToCenterRatioOnce(){
    state = normalizeState(state);
    if(state.coordinateVersion === 3) return false;
    const rect = boardSurface.getBoundingClientRect();
    if(rect.width < 1 || rect.height < 1) return false;
    let changed = false;
    day().magnets.forEach(m=>{
      if(coordinateModeOf(m) === 'centerRatio') return;
      const probe=document.createElement('div');
      probe.className = m.kind==='person'
        ? 'floating-chip name-chip'
        : `floating-chip status-chip ${statusClassForValue(m.value)}`;
      probe.style.position='absolute';
      probe.style.visibility='hidden';
      probe.textContent = m.kind==='person'
        ? (state.people.find(x=>x.id===m.personId)?.name || '')
        : (m.value || '');
      floatingLayer.appendChild(probe);
      const pos=magnetDisplayPosition(m,probe,rect);
      const centerX=pos.x + probe.offsetWidth/2;
      const centerY=pos.y + probe.offsetHeight/2;
      probe.remove();
      m.x=Number((centerX/Math.max(1,rect.width)).toFixed(6));
      m.y=Number((centerY/Math.max(1,rect.height)).toFixed(6));
      m.coordinateMode='centerRatio';
      changed=true;
    });
    state.coordinateVersion=3;
    return changed;
  }

  // localStorage/sessionStorage へ保存しないため、古いブラウザ状態が後日サーバーを上書きする経路が無い。

  function markChanged(delayMs = SAVE_DEBOUNCE_MS, kind='user'){

  function compactStateFrom(value){
    const src = normalizeState(cloneState(value));
    return {
      coordinateVersion:Number(src.coordinateVersion || 0),
      people: src.people.map(p => ({id:String(p.id), name:String(p.name)})),
      days: {board: {
        drawingGeneration:String(src.days.board.drawingGeneration||'legacy'),
        magnets: src.days.board.magnets.map(m => {
          const mode = coordinateModeOf(m);
          return {
            id:String(m.id), kind:String(m.kind),
            ...(m.personId ? {personId:String(m.personId)} : {}),
            ...(m.value ? {value:String(m.value)} : {}),
            x:mode === 'pixel' ? Math.round(Number(m.x)||0) : Number(clamp01(m.x).toFixed(6)),
            y:mode === 'pixel' ? Math.round(Number(m.y)||0) : Number(clamp01(m.y).toFixed(6)),
            ...(mode === 'centerRatio' ? {coordinateMode:'centerRatio'} : {}),
            ...(mode === 'boardRatio' ? {coordinateMode:'boardRatio'} : {}),
            ...(mode === 'legacyRatio' ? {coordinateMode:'ratio'} : {})
          };
        }),
        drawingBase: typeof src.days.board.drawingBase === 'string' ? src.days.board.drawingBase : '',
        strokes: src.days.board.strokes.map(st => ({
          ...(st.id ? {id:String(st.id)} : {}),
          ...(st.createdAt ? {createdAt:Number(st.createdAt)} : {}),
          ...(st.clientId ? {clientId:String(st.clientId)} : {}),
          tool:st.tool === 'erase' ? 'erase' : 'pen',
          width:Math.round(Number(st.width)||PEN_WIDTH),
          points:(st.points||[]).map(pt => [Number(Number(pt[0]).toFixed(4)), Number(Number(pt[1]).toFixed(4))])
        }))
      }}
    };
  }

  function compactState(){ return compactStateFrom(state); }
  function stablePayload(){ return JSON.stringify(compactState()); }
  function sameJson(a,b){ return JSON.stringify(a)===JSON.stringify(b); }

  function mergeById(baseArr, localArr, remoteArr){
    const base=new Map((baseArr||[]).map(x=>[String(x.id),x]));
    const local=new Map((localArr||[]).map(x=>[String(x.id),x]));
    const remote=new Map((remoteArr||[]).map(x=>[String(x.id),x]));
    for(const [id,b] of base){
      if(!local.has(id)) remote.delete(id);
      else if(!sameJson(local.get(id),b)) remote.set(id,local.get(id));
    }
    for(const [id,l] of local){ if(!base.has(id)) remote.set(id,l); }
    return [...remote.values()];
  }

  function strokeIdentity(st){
    if(st && st.id) return 'id:'+String(st.id);
    return 'legacy:'+JSON.stringify({tool:st?.tool,width:st?.width,points:st?.points});
  }

  function mergeStrokes(base,local,remote){
    base=base||[]; local=local||[]; remote=remote||[];
    if(sameJson(local,base)) return remote;
    const baseCount=new Map();
    const localCount=new Map();
    const remoteItems=remote.map(st=>({key:strokeIdentity(st),st}));
    for(const st of base){ const k=strokeIdentity(st); baseCount.set(k,(baseCount.get(k)||0)+1); }
    for(const st of local){ const k=strokeIdentity(st); localCount.set(k,(localCount.get(k)||0)+1); }

    // ローカルで Undo 等により消された base ストロークだけ remote から同数除去する。
    const removeCount=new Map();
    for(const [k,n] of baseCount){
      const keep=localCount.get(k)||0;
      if(keep<n) removeCount.set(k,n-keep);
    }
    const merged=[];
    for(const item of remoteItems){
      const n=removeCount.get(item.key)||0;
      if(n>0){ removeCount.set(item.key,n-1); continue; }
      merged.push(item.st);
    }

    // base になかったローカル新規ストロークを追加する。新規ストロークは id があるため重複しない。
    const existing=new Map();
    for(const st of merged){ const k=strokeIdentity(st); existing.set(k,(existing.get(k)||0)+1); }
    const seenLocal=new Map();
    for(const st of local){
      const k=strokeIdentity(st);
      const seen=(seenLocal.get(k)||0)+1; seenLocal.set(k,seen);
      const baseN=baseCount.get(k)||0;
      if(seen<=baseN) continue;
      const already=existing.get(k)||0;
      const desired=(localCount.get(k)||0);
      if(already<desired){ merged.push(st); existing.set(k,already+1); }
    }
    return merged;
  }

  function mergeLocalChanges(baseValue,localValue,remoteValue){
    const base=compactStateFrom(baseValue||defaultState());
    const local=compactStateFrom(localValue||defaultState());
    const remote=compactStateFrom(remoteValue||defaultState());
    remote.people=mergeById(base.people,local.people,remote.people);
    remote.days.board.magnets=mergeById(base.days.board.magnets,local.days.board.magnets,remote.days.board.magnets);

    const baseDrawGen=String(base.days.board.drawingGeneration||'legacy');
    const localDrawGen=String(local.days.board.drawingGeneration||'legacy');
    const remoteDrawGen=String(remote.days.board.drawingGeneration||'legacy');
    if(localDrawGen!==baseDrawGen){
      // この端末で「全消去」が行われた。意図的な描画世代更新としてローカルを優先する。
      remote.days.board.drawingGeneration=localDrawGen;
      remote.days.board.drawingBase=local.days.board.drawingBase||'';
      remote.days.board.strokes=local.days.board.strokes||[];
    }else if(remoteDrawGen!==baseDrawGen){
      // 他端末で全消去された場合、古い世代の手書きを復活させない。
      remote.days.board.drawingGeneration=remoteDrawGen;
    }else{
      remote.days.board.drawingGeneration=remoteDrawGen;
      remote.days.board.drawingBase=remote.days.board.drawingBase||local.days.board.drawingBase||'';
      remote.days.board.strokes=mergeStrokes(base.days.board.strokes,local.days.board.strokes,remote.days.board.strokes);
    }
    remote.coordinateVersion=Math.max(Number(remote.coordinateVersion||0),Number(local.coordinateVersion||0));
    return normalizeState(remote);
  }

  function jsonp(params, timeoutMs = REQUEST_TIMEOUT_MS){
    return new Promise((resolve, reject) => {
      if(!isGasConfigured()) return reject(new Error('GAS_URL_NOT_CONFIGURED'));
      const callbackName = '__hiroxJsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let done=false;
      const timer=setTimeout(()=>finish(new Error('timeout')),timeoutMs);
      function finish(error,data){
        if(done) return; done=true; clearTimeout(timer);
        try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
        script.remove(); error?reject(error):resolve(data);
      }
      window[callbackName]=data=>finish(null,data);
      script.onerror=()=>finish(new Error('network'));
      const query=new URLSearchParams({...params,token:API_TOKEN,callback:callbackName,_:Date.now().toString()});
      script.src=GAS_URL+(GAS_URL.includes('?')?'&':'?')+query.toString();
      document.head.appendChild(script);
    });
  }

  function postByHiddenForm(fields){
    return new Promise((resolve,reject)=>{
      if(!isGasConfigured()) return reject(new Error('GAS_URL_NOT_CONFIGURED'));
      const iframeName='syncFrame_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const iframe=document.createElement('iframe'); iframe.name=iframeName; iframe.style.display='none';
      const form=document.createElement('form'); form.method='POST'; form.action=GAS_URL; form.target=iframeName; form.style.display='none';
      Object.entries(fields).forEach(([name,value])=>{ const input=document.createElement('input'); input.type='hidden'; input.name=name; input.value=String(value??''); form.appendChild(input); });
      document.body.append(iframe,form);
      try{ form.submit(); setTimeout(resolve,100); }catch(err){ reject(err); }
      setTimeout(()=>{form.remove();iframe.remove();},30000);
    });
  }

  async function waitForAck(requestId, expectedGeneration){
    const deadline=Date.now()+Math.min(8000,REQUEST_TIMEOUT_MS);
    await new Promise(r=>setTimeout(r,ACK_POLL_MS));
    while(Date.now()<deadline){
      try{
        const res=await jsonp({action:'ack',requestId,generation:expectedGeneration},4500);
        if(res && !res.pending) return res;
      }catch(e){}
      await new Promise(r=>setTimeout(r,ACK_POLL_MS));
    }
    return null;
  }

  async function verifySaveOnServer(req){
    try{
      const meta=await jsonp({action:'meta',verify:'1'},8000);
      if(meta && meta.ok){
        if(String(meta.generationId||'')!==String(req.generationId||'')){
          return {ok:false,generationMismatch:true,error:'generation_mismatch',generationId:meta.generationId,revision:Number(meta.revision||0)};
        }
        if(String(meta.requestId||'')===String(req.requestId)){
          return {ok:true,generationId:meta.generationId,revision:Number(meta.revision||req.baseRevision+1),verifiedBy:'meta'};
        }
      }
    }catch(e){}
    try{
      const res=await jsonp({action:'load',clientId,since:-1,generation:req.generationId,verify:'1'},REQUEST_TIMEOUT_MS);
      if(!res || !res.ok) return null;
      if(String(res.generationId||'')!==String(req.generationId||'')){
        return {ok:false,generationMismatch:true,error:'generation_mismatch',generationId:res.generationId,revision:Number(res.revision||0),state:res.state||null};
      }
      const remotePayload=JSON.stringify(compactStateFrom(res.state||defaultState()));
      if(remotePayload===req.payload){
        return {ok:true,generationId:res.generationId,revision:Number(res.revision||req.baseRevision+1),verifiedBy:'state'};
      }
      if(Number(res.revision||0)>Number(req.baseRevision||0)){
        return {ok:false,conflict:true,revision:Number(res.revision||0),generationId:res.generationId,state:res.state||null,verifiedBy:'revision'};
      }
    }catch(e){}
    return null;
  }

  function friendlySyncError(code){
    const c=String(code||'unknown');
    const map={
      'generation_mismatch':'サーバーが初期化されました',
      'revision_conflict':'他端末の更新と競合',
      'server_busy':'サーバー処理待ち',
      'Payload too large':'データ容量超過',
      'Drawing base too large':'手書き画像容量超過',
      'Invalid stroke':'手書きデータ異常',
      'Unauthorized':'トークン不一致',
      'JSON_PARSE_FAILED':'POSTデータ解析失敗',
      'Empty payload':'POSTデータ空',
      'save_unconfirmed':'保存確認できず',
      'timeout':'応答タイムアウト',
      'network':'通信エラー'
    };
    for(const [key,label] of Object.entries(map)) if(c.includes(key)) return label+' ('+c+')';
    return c;
  }

  function storeDiagnostic(diag){
    lastSyncDiagnostic=diag;
    try{ localStorage.setItem(DIAG_KEY,JSON.stringify(diag)); }catch(e){}
    console.error('HJP同期診断',diag);
  }

  async function fetchDiagnostic(requestId, clientError){
    const diag={
      at:new Date().toISOString(), requestId:String(requestId||''), clientError:String(clientError||''),
      localRevision:revision, generationId, payloadChars:pendingSave?.payload?.length||0, retryCount:saveRetryCount
    };
    try{ diag.status=await jsonp({action:'status',requestId,generation},7000); }catch(e){ diag.statusError=String(e?.message||e); }
    try{ diag.server=await jsonp({action:'diag',requestId},10000); }catch(e){ diag.diagError=String(e?.message||e); }
    storeDiagnostic(diag); return diag;
  }

  function diagnosticSummary(diag){
    const server=diag?.server; const status=diag?.status;
    const err=status && status.ok===false ? status.error :
      server?.ack && server.ack.ok===false ? server.ack.error :
      server?.last?.stage==='POST_ERROR' ? server.last?.details?.error :
      diag?.clientError || '保存確認できず';
    const stage=server?.last?.stage||'SERVER_DIAG_NOT_RECEIVED';
    const size=server?.file?.bytes ? Math.round(server.file.bytes/1024)+'KB' : '-';
    return {err:String(err||''),stage,size};
  }

  function scheduleSaveRetry(reason){
    if(!isDirty) return;
    const delay=SAVE_RETRY_DELAYS[Math.min(saveRetryCount,SAVE_RETRY_DELAYS.length-1)];
    saveRetryCount++;
    clearTimeout(saveTimer); saveTimer=setTimeout(saveRemote,delay);
    const label=reason ? '未同期: '+friendlySyncError(reason) : '未同期・自動再試行';
    setSyncStatus('error',label.length>34?label.slice(0,34)+'…':label);
    syncBadge.title='クリックで同期診断を表示';
  }

  function adoptRemoteState(remoteState, remoteRevision, remoteGeneration){
    state=normalizeState(remoteState||defaultState());
    revision=Number(remoteRevision||0);
    generationId=String(remoteGeneration||'');
    remoteReady=true; isDirty=false; dirtyKind='user'; pendingSave=null; saveRetryCount=0;
    lastSyncedState=cloneState(state); lastSavedPayload=stablePayload();
    document.body.classList.remove('sync-locked');
    clearPendingLocal(); cacheState(); render();
  }

  async function handleGenerationMismatch(localSnapshot, reason='generation_mismatch'){
    // 世代変更時はローカル内容を自動復元・自動統合しない。サーバーが常に勝つ。
    pendingSave=null; isDirty=false; dirtyKind='user'; clearPendingLocal();
    const res=await jsonp({action:'load',clientId,since:-1,generation:'',verify:'1'},REQUEST_TIMEOUT_MS);
    if(!res || !res.ok) throw new Error('generation_reload_failed');
    adoptRemoteState(res.state||defaultState(),res.revision,res.generationId);
    setSyncStatus('ok','同期済み');
    toast('サーバーが初期化・更新されたため、端末の古い状態は破棄しました。');
    scheduleDrawingMaintenanceIfNeeded();
  }

  async function resolveConflict(requestSnapshot, requestKind){
    const res=await jsonp({action:'load',clientId,since:-1,generation:generationId,verify:'1'},REQUEST_TIMEOUT_MS);
    if(!res || !res.ok) throw new Error('conflict_reload_failed');
    if(String(res.generationId||'')!==String(generationId||'')){
      await handleGenerationMismatch(requestKind==='user'?requestSnapshot:null,'conflict_generation_changed');
      return;
    }
    const remoteState=normalizeState(res.state||defaultState());
    if(requestKind==='maintenance'){
      // 圧縮は派生データなので競合した圧縮そのものは捨てる。
      // ただし圧縮送信中にユーザーが追記していた場合、その追記だけは最新サーバー状態へ統合する。
      const latestLocal=compactState();
      if(sameJson(latestLocal,requestSnapshot)){
        adoptRemoteState(remoteState,res.revision,res.generationId);
        scheduleDrawingMaintenanceIfNeeded();
        return;
      }
      state=mergeLocalChanges(requestSnapshot,latestLocal,remoteState);
      revision=Number(res.revision||0);
      generationId=String(res.generationId||generationId);
      lastSyncedState=cloneState(remoteState);
      lastSavedPayload=JSON.stringify(compactStateFrom(remoteState));
      pendingSave=null; isDirty=true; dirtyKind='user';
      cacheState(); writePendingLocal(); render();
      setSyncStatus('saving','追記を統合中…');
      return;
    }
    const base=pendingSave?.baseState || lastSyncedState || defaultState();
    state=mergeLocalChanges(base,requestSnapshot,remoteState);
    revision=Number(res.revision||0);
    generationId=String(res.generationId||generationId);
    lastSyncedState=cloneState(remoteState);
    lastSavedPayload=JSON.stringify(compactStateFrom(remoteState));
    pendingSave=null; isDirty=true; dirtyKind='user';
    cacheState(); writePendingLocal(); render();
    setSyncStatus('saving','変更を統合中…');
  }

  async function saveRemote(){
    if(MOBILE_VIEW_ONLY || !remoteReady || saveInFlight || !isDirty) return;
    if(!isGasConfigured()){ setSyncStatus('error','GAS URL未設定'); return; }
    if(!generationId){ setSyncStatus('loading','サーバー世代確認中'); return; }

    const currentPayload=stablePayload();
    if(currentPayload===lastSavedPayload){
      isDirty=false; dirtyKind='user'; pendingSave=null; saveRetryCount=0; clearPendingLocal();
      setSyncStatus('ok','同期済み'); scheduleDrawingMaintenanceIfNeeded(); return;
    }
    if(!pendingSave || pendingSave.payload!==currentPayload || pendingSave.generationId!==generationId){
      pendingSave={
        requestId:clientId+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),
        payload:currentPayload, baseRevision:revision, generationId,
        baseState:cloneState(lastSyncedState||defaultState()), kind:dirtyKind
      };
    }

    saveInFlight=true;
    setSyncStatus('saving',dirtyKind==='maintenance'?'データ整理中…':'同期中…');
    const req=pendingSave;
    const localSnapshot=JSON.parse(req.payload);
    try{
      await postByHiddenForm({action:'save',token:API_TOKEN,requestId:req.requestId,clientId,revision:req.baseRevision,generation:req.generationId,payload:req.payload});
      let ack=await waitForAck(req.requestId,req.generationId);
      if(!ack || (!ack.ok && !ack.conflict && !ack.generationMismatch)){
        const verified=await verifySaveOnServer(req); if(verified) ack=verified;
      }
      if(ack && (ack.generationMismatch || ack.error==='generation_mismatch')){
        await handleGenerationMismatch(req.kind==='user'?localSnapshot:null,'save_generation_changed');
      }else if(ack && ack.conflict){
        await resolveConflict(localSnapshot,req.kind); saveRetryCount=0;
      }else if(!ack || !ack.ok){
        throw new Error(ack&&ack.error?ack.error:'save_unconfirmed');
      }else{
        if(ack.generationId && String(ack.generationId)!==generationId){
          await handleGenerationMismatch(req.kind==='user'?localSnapshot:null,'ack_generation_changed');
        }else{
          revision=Number(ack.revision||revision);
          generationId=String(ack.generationId||generationId);
          lastSavedPayload=req.payload; lastSyncedState=cloneState(localSnapshot);
          pendingSave=null; saveRetryCount=0;
          isDirty=stablePayload()!==lastSavedPayload;
          if(!isDirty) dirtyKind='user';
          cacheState();
          if(isDirty && dirtyKind==='user') writePendingLocal(); else if(!isDirty) clearPendingLocal();
          setSyncStatus(isDirty?'saving':'ok',isDirty?'未同期・自動保存':'同期済み');
          if(!isDirty) scheduleDrawingMaintenanceIfNeeded();
        }
      }
    }catch(e){
      console.error('保存確認エラー',e);
      if(dirtyKind==='user') writePendingLocal();
      const diag=await fetchDiagnostic(req.requestId,e?.message||e);
      const summary=diagnosticSummary(diag); scheduleSaveRetry(summary.err);
      const now=Date.now();
      if(now-lastFailureToastAt>60000){
        lastFailureToastAt=now;
        toast('同期診断: '+friendlySyncError(summary.err)+' / 段階: '+summary.stage+' / JSON: '+summary.size);
      }
    }finally{
      saveInFlight=false;
      if(isDirty && saveRetryCount===0){ clearTimeout(saveTimer); saveTimer=setTimeout(saveRemote,500); }
    }
  }

  async function loadRemote({initial=false,forceVerify=false}={}){
    if(loadInFlight || saveInFlight || drag || activeStroke || (isDirty && remoteReady)) return;
    if(!isGasConfigured()){ setSyncStatus('error','GAS URL未設定'); return; }
    loadInFlight=true;
    if(initial) setSyncStatus('loading','同期確認中…');
    try{
      const verify=initial||forceVerify;
      const res=await jsonp({
        action:'load',clientId,since:initial?-1:revision,generation:generationId,verify:verify?'1':'0'
      },REQUEST_TIMEOUT_MS);
      if(!res || !res.ok) throw new Error(res&&res.error?res.error:'load_failed');
      const remoteRevision=Number(res.revision||0);
      const remoteGeneration=String(res.generationId||'');

      if(res.notModified){
        remoteReady=true;
        setSyncStatus('ok','同期済み');
        return;
      }

      const remoteState=normalizeState(res.state||defaultState());
      if(initial){
        // 初回起動は必ずサーバー状態をそのまま採用する。ブラウザキャッシュとのマージは禁止。
        adoptRemoteState(remoteState,remoteRevision,remoteGeneration);
        setSyncStatus('ok','同期済み');
        scheduleDrawingMaintenanceIfNeeded();
      }else if(remoteGeneration!==generationId){
        await handleGenerationMismatch(null,'poll_generation_changed');
      }else if(remoteRevision>revision){
        adoptRemoteState(remoteState,remoteRevision,remoteGeneration);
        setSyncStatus('ok','同期済み');
        scheduleDrawingMaintenanceIfNeeded();
      }else{
        remoteReady=true; setSyncStatus('ok','同期済み');
      }

      requestAnimationFrame(()=>{
        if(!MOBILE_VIEW_ONLY && migrateMagnetsToCenterRatioOnce()){
          renderFloating(); cacheState();
          // 座標変換は表示互換のためだけで、古いキャッシュをサーバーへ勝手に復活させない。
        }
      });
    }catch(e){
      console.error('読み込みエラー',e);
      if(initial){
        // サーバーを確認できない時は古いキャッシュを表示せず、編集も許可しない。
        state=defaultState(); generationId=''; revision=0; isDirty=false; pendingSave=null;
        remoteReady=false; document.body.classList.add('sync-locked'); render();
        setSyncStatus('error','サーバー接続待ち');
      }else setSyncStatus('error','再接続待ち');
    }finally{ loadInFlight=false; }
  }

  function placedPersonIds(){
    return new Set(day().magnets.filter(m=>m.kind==='person').map(m=>m.personId));
  }

  function renderPeople(){
    const placed = placedPersonIds();
    peopleList.innerHTML='';
    const free = state.people.filter(p=>!placed.has(p.id));
    if(!free.length) peopleList.innerHTML='<div class="empty">氏名マグネットは未登録です。［＋ 氏名追加］から追加してください。</div>';
    free.forEach(p=>{
      const row=document.createElement('div');
      row.className='person-card';
      const chip=document.createElement('div');
      chip.className='name-chip';
      chip.textContent=p.name;
      chip.dataset.type='person';
      chip.dataset.id=p.id;
      const del=document.createElement('button');
      del.className='tiny';
      del.textContent='⋮';
      del.title='削除';
      del.onclick=()=>{
        if(confirm(`${p.name} を氏名一覧から削除しますか？`)){
          state.people = state.people.filter(x=>x.id!==p.id);
          Object.values(state.days).forEach(d=>{ if(Array.isArray(d.magnets)) d.magnets = d.magnets.filter(m=>m.personId!==p.id); });
          markChanged();
          render();
        }
      };
      row.append(chip, del);
      peopleList.append(row);
      attachTrayDrag(chip);
    });

  function renderRows(){
    rowsEl.innerHTML='';
    for(let i=0;i<ROW_COUNT;i++){
      const row=document.createElement('div');
      row.className='row';
      row.innerHTML='<div class="cell"></div><div class="cell"></div><div class="cell"></div>';

  function statusClassForValue(value){
    if(value === '出張') return 'status-trip';
    if(['1F','3F','4F','5F','6F'].includes(value)) return 'status-floor';
    return 'status-direct';
  }

  function renderFloating(){
    floatingLayer.innerHTML='';
    day().magnets.forEach(m=>{
      const el=document.createElement('div');
      const className = m.kind==='person'
        ? 'floating-chip name-chip'
        : `floating-chip status-chip ${statusClassForValue(m.value)}`;
      el.className = className;
      el.style.visibility = 'hidden';
      el.dataset.magnetId = m.id;
      if(m.kind==='person'){
        const p = state.people.find(x=>x.id===m.personId);
        el.textContent = p ? p.name : '';
      } else {
        el.textContent = m.value;
      }
      floatingLayer.append(el);
      const pos = magnetDisplayPosition(m, el);
      el.style.left = `${pos.x}px`;
      el.style.top = `${pos.y}px`;
      el.style.visibility = 'visible';
      attachPlacedDrag(el);
    });
  }

  function renderCanvas(){
    resizeDrawingCanvas();
    redrawDrawingFromState();
  }

  let layoutFrame1=0;
  let layoutFrame2=0;
  function scheduleGeometryRefresh(){
    cancelAnimationFrame(layoutFrame1);
    cancelAnimationFrame(layoutFrame2);
    layoutFrame1=requestAnimationFrame(()=>{
      layoutFrame2=requestAnimationFrame(()=>{
        renderFloating();
        renderCanvas();
      });
    });
  }

  function render(){
    renderPeople();
    renderRows();
    renderFloating();
    renderCanvas();
  }

  function configureDrawingContext(){
    const ratio = Math.max(1, window.devicePixelRatio || 1);
    const ctx = drawingCanvas.getContext('2d');
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    return ctx;
  }

  let drawingBaseImage = null;
  let drawingBaseImageSrc = '';
  let drawingBaseLoadToken = 0;

  function resetDrawingBaseImageCache(){
    drawingBaseImage=null;
    drawingBaseImageSrc='';
    drawingBaseLoadToken++;
  }

  function drawBaseAndStrokes(ctx){
    const rect=drawingCanvas.getBoundingClientRect();
    const base=String(day().drawingBase||'');
    const drawRest=()=>{
      day().strokes.forEach(stroke=>drawStroke(ctx,stroke));
      ctx.globalCompositeOperation='source-over';
    };
    if(!base){ drawRest(); return; }
    if(drawingBaseImage && drawingBaseImageSrc===base && drawingBaseImage.complete){
      ctx.globalCompositeOperation='source-over';
      ctx.drawImage(drawingBaseImage,0,0,rect.width,rect.height);
      drawRest();
      return;
    }
    const token=++drawingBaseLoadToken;
    const img=new Image();
    drawingBaseImage=img;
    drawingBaseImageSrc=base;
    img.onload=()=>{
      if(token!==drawingBaseLoadToken || String(day().drawingBase||'')!==base) return;
      redrawDrawingFromState();
      scheduleDrawingMaintenanceIfNeeded();
    };
    img.onerror=()=>console.warn('統合済み手書き画像の読み込みに失敗しました。');
    img.src=base;
  }

  function captureDrawingBase(){
    const rect=drawingCanvas.getBoundingClientRect();
    if(rect.width<1 || rect.height<1) return '';
    const aspect=rect.height/Math.max(1,rect.width);
    let width=Math.max(360,Math.min(DRAWING_BASE_MAX_DIMENSION,Math.round(rect.width)));
    let height=Math.max(360,Math.round(width*aspect));
    if(height>DRAWING_BASE_MAX_DIMENSION){
      height=DRAWING_BASE_MAX_DIMENSION;
      width=Math.max(360,Math.round(height/Math.max(0.01,aspect)));
    }
    let best='';
    let quality=0.92;
    for(let attempt=0;attempt<7;attempt++){
      const off=document.createElement('canvas');
      off.width=Math.max(1,Math.round(width)); off.height=Math.max(1,Math.round(height));
      const octx=off.getContext('2d');
      octx.clearRect(0,0,off.width,off.height);
      octx.drawImage(drawingCanvas,0,0,drawingCanvas.width,drawingCanvas.height,0,0,off.width,off.height);
      let url=off.toDataURL('image/webp',quality);
      if(!url.startsWith('data:image/webp')) url=off.toDataURL('image/png');
      if(!best || url.length<best.length) best=url;
      if(url.length<=DRAWING_BASE_MAX_CHARS) return url;
      width=Math.max(420,Math.round(width*0.84));
      height=Math.max(420,Math.round(height*0.84));
      quality=Math.max(0.62,quality-0.07);
    }
    return best;
  }

  function compactDrawingHistory(reason='maintenance'){
    const base=captureDrawingBase();
    if(!base || base.length>DRAWING_BASE_MAX_CHARS) return false;
    const d=day();
    const before=d.strokes.length;
    d.drawingBase=base;
    d.strokes=[];
    resetDrawingBaseImageCache();
    cacheState();
    console.info('手書き履歴を自動整理しました',{reason,before,baseChars:base.length});
    return true;
  }

  function needsDrawingMaintenance(){
    const d=day();
    if(!remoteReady || isDirty || saveInFlight || activeStroke || drag) return false;
    if(d.drawingBase){
      const ready=drawingBaseImage && drawingBaseImageSrc===d.drawingBase && drawingBaseImage.complete && drawingBaseImage.naturalWidth>0;
      if(!ready) return false;
    }
    if(d.strokes.some(st=>st.tool==='erase')) return true;
    if(d.strokes.length>=DRAWING_COMPACT_STROKE_THRESHOLD) return true;
    try{ if(stablePayload().length>=DRAWING_PAYLOAD_SOFT_LIMIT && d.strokes.length>0) return true; }catch(e){}
    return false;
  }

  function scheduleDrawingMaintenanceIfNeeded(){
    if(MOBILE_VIEW_ONLY) return;
    clearTimeout(maintenanceTimer);
    if(!needsDrawingMaintenance()) return;
    maintenanceTimer=setTimeout(()=>{
      if(!needsDrawingMaintenance()) return;
      redrawDrawingFromState();
      requestAnimationFrame(()=>{
        if(!needsDrawingMaintenance()) return;
        if(compactDrawingHistory('post_sync')){
          dirtyKind='maintenance';
          markChanged(120,'maintenance');
        }
      });
    },800);
  }

  function resizeDrawingCanvas(){
    const rect = boardSurface.getBoundingClientRect();
    const ratio = Math.max(1, window.devicePixelRatio || 1);
    const needW = Math.max(1, Math.round(rect.width * ratio));
    const needH = Math.max(1, Math.round(rect.height * ratio));
    drawingCanvas.style.width = rect.width + 'px';
    drawingCanvas.style.height = rect.height + 'px';
    if(drawingCanvas.width !== needW || drawingCanvas.height !== needH){
      drawingCanvas.width = needW;
      drawingCanvas.height = needH;
    }
    configureDrawingContext();
  }

  function drawStroke(ctx, stroke){
    if(!stroke || !Array.isArray(stroke.points) || stroke.points.length < 1) return;
    const rect = drawingCanvas.getBoundingClientRect();
    ctx.globalCompositeOperation = stroke.tool === 'erase' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Number(stroke.width || (stroke.tool === 'erase' ? ERASER_WIDTH : PEN_WIDTH));
    ctx.beginPath();
    const first = stroke.points[0];
    ctx.moveTo(first[0] * rect.width, first[1] * rect.height);
    for(let i=1;i<stroke.points.length;i++){
      const p = stroke.points[i];
      ctx.lineTo(p[0] * rect.width, p[1] * rect.height);
    }
    if(stroke.points.length === 1){
      ctx.lineTo(first[0] * rect.width + 0.8, first[1] * rect.height + 0.8);
    }
    ctx.stroke();
  }

  function redrawDrawingFromState(){
    const ctx = configureDrawingContext();
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,drawingCanvas.width,drawingCanvas.height);
    ctx.restore();
    drawBaseAndStrokes(ctx);
  }

  function canvasPointFromClient(clientX, clientY){
    const rect = drawingCanvas.getBoundingClientRect();
    return {
      rect,
      point:[
        Math.max(0,Math.min(1,(clientX-rect.left)/Math.max(1,rect.width))),
        Math.max(0,Math.min(1,(clientY-rect.top)/Math.max(1,rect.height)))
      ]
    };
  }

  function updateModeUi(announce=true){
    const erasing=drawingMode==='erase';
    modeToggle.classList.toggle('erase-mode',erasing);
    boardSurface.classList.toggle('erase-mode',erasing);
    modeBanner.classList.toggle('show',erasing);
    modeToggle.setAttribute('aria-checked',erasing?'true':'false');
    modeTitle.textContent=erasing?'消しゴムモード':'SCHEDULE BOARD';
    eraserModeMark.classList.toggle('active',erasing);
    eraserModeMark.setAttribute('aria-pressed',erasing?'true':'false');
    eraserModeMark.setAttribute('aria-label',erasing?'手書きモードに戻す':'消しゴムモードに切り替える');
    if(!erasing) eraserCursor.classList.remove('show');
    if(announce) toast(erasing?'消しゴムに切り替えました':'手書きに戻しました');
  }

  function toggleDrawingMode(){
    if(MOBILE_VIEW_ONLY) return;
    drawingMode=drawingMode==='pen'?'erase':'pen';
    updateModeUi(true);
  }

  modeToggle.addEventListener('pointerup',e=>{
    if(!e.isPrimary) return;
    e.preventDefault();
    toggleDrawingMode();
  },{passive:false});
  modeToggle.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleDrawingMode();}
  });

  eraserModeMark.addEventListener('pointerdown',e=>{
    e.stopPropagation();
  });
  eraserModeMark.addEventListener('pointerup',e=>{
    if(!e.isPrimary) return;
    e.preventDefault();
    e.stopPropagation();
    toggleDrawingMode();
  },{passive:false});
  eraserModeMark.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      e.stopPropagation();
      toggleDrawingMode();
    }
  });

  function stylusEraserPressed(e){
    return e.pointerType==='pen' && (e.button===5 || (e.buttons & 32)===32);
  }

  function effectiveTool(e){
    return drawingMode==='erase' || stylusEraserPressed(e) ? 'erase' : 'pen';
  }

  function showEraserCursor(clientX,clientY){
    const rect=boardSurface.getBoundingClientRect();
    eraserCursor.style.left=(clientX-rect.left)+'px';
    eraserCursor.style.top=(clientY-rect.top)+'px';
    eraserCursor.classList.add('show');
  }

  function beginStroke(pointerId,tool,clientX,clientY){
    const {point}=canvasPointFromClient(clientX,clientY);
    activeStroke={
      pointerId,
      stroke:{
        id:'s_'+clientId+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),
        createdAt:Date.now(), clientId,
        tool,width:tool==='erase'?ERASER_WIDTH:PEN_WIDTH,points:[point]
      }
    };
    drawStroke(configureDrawingContext(),activeStroke.stroke);
  }

  function appendStrokePoint(e){
    if(!activeStroke || activeStroke.pointerId!==e.pointerId) return;
    const {point}=canvasPointFromClient(e.clientX,e.clientY);
    const points=activeStroke.stroke.points;
    const prev=points[points.length-1];
    if(Math.abs(point[0]-prev[0])+Math.abs(point[1]-prev[1])<0.0012) return;
    points.push(point);
    drawStroke(configureDrawingContext(),{...activeStroke.stroke,points:[prev,point]});
  }

  drawingCanvas.addEventListener('contextmenu',e=>e.preventDefault());
  drawingCanvas.addEventListener('pointerdown',e=>{
    if(MOBILE_VIEW_ONLY) return;
    if(drag || activeStroke || !e.isPrimary) return;
    if(e.pointerType==='mouse' && e.button!==0 && e.button!==5) return;
    e.preventDefault();
    try{ drawingCanvas.setPointerCapture(e.pointerId); }catch(_e){}
    const tool=effectiveTool(e);
    beginStroke(e.pointerId,tool,e.clientX,e.clientY);
    if(tool==='erase') showEraserCursor(e.clientX,e.clientY);
  },{passive:false});

  drawingCanvas.addEventListener('pointermove',e=>{
    if(MOBILE_VIEW_ONLY) return;
    if(!e.isPrimary) return;
    if(activeStroke && activeStroke.pointerId===e.pointerId){
      appendStrokePoint(e);
      if(activeStroke.stroke.tool==='erase') showEraserCursor(e.clientX,e.clientY);
      e.preventDefault();
      return;
    }
    if(drawingMode==='erase' && (e.pointerType==='mouse'||e.pointerType==='pen')){
      showEraserCursor(e.clientX,e.clientY);
    }
  },{passive:false});

  drawingCanvas.addEventListener('pointerleave',()=>{
    if(!activeStroke) eraserCursor.classList.remove('show');
  });

  function simplifyPoints(points){
    if(!Array.isArray(points)||points.length<3) return points||[];
    const out=[points[0]];
    for(let i=1;i<points.length-1;i++){
      const a=out[out.length-1],b=points[i];
      if(Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1])>=0.0022) out.push(b);
    }
    out.push(points[points.length-1]);
    return out;
  }

  function finishCanvasPointer(e){
    if(!activeStroke || activeStroke.pointerId!==e.pointerId) return;
    activeStroke.stroke.points=simplifyPoints(activeStroke.stroke.points);
    const completed=activeStroke.stroke;
    activeStroke=null;
    eraserCursor.classList.remove('show');

    // ペンも消しゴムもまず「ユーザー操作」としてサーバーへ保存する。
    // 消しゴム履歴の画像統合は保存成功後のメンテナンス処理で行うため、
    // 他端末との競合時に手書きが欠落しない。
    day().strokes.push(completed);
    redrawDrawingFromState();
    markChanged(completed.tool==='erase'?100:120,'user');
  }

  drawingCanvas.addEventListener('pointerup',finishCanvasPointer);
  drawingCanvas.addEventListener('pointercancel',finishCanvasPointer);
  drawingCanvas.addEventListener('lostpointercapture',e=>{
    if(activeStroke && activeStroke.pointerId===e.pointerId) finishCanvasPointer(e);
  });

  function attachTrayDrag(el){
    if(MOBILE_VIEW_ONLY) return;
    el.onpointerdown = e => {
      e.preventDefault();
      e.stopPropagation();
      startDragFromElement(el, {
        sourceType:el.dataset.type,
        personId:el.dataset.id || null,
        value:el.dataset.value || null,
        fromMagnetId:null
      }, e, true);
    };
  }

  function attachPlacedDrag(el){
    if(MOBILE_VIEW_ONLY) return;
    el.onpointerdown = e => {
      e.preventDefault();
      e.stopPropagation();
      const m = day().magnets.find(x=>x.id===el.dataset.magnetId);
      if(!m) return;
      startDragFromElement(el, {
        sourceType:'placed', personId:m.personId || null, value:m.value || null,
        kind:m.kind, fromMagnetId:m.id
      }, e, false);
    };
  }

  function startDragFromElement(el, payload, e, centerOnFirstDrop){
    const rect = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.minWidth = rect.width + 'px';
    ghost.style.minHeight = rect.height + 'px';
    document.body.append(ghost);
    drag = {
      ...payload, ghost,
      dx:centerOnFirstDrop ? rect.width/2 : e.clientX-rect.left,
      dy:centerOnFirstDrop ? rect.height/2 : e.clientY-rect.top,
      pointerId:e.pointerId, width:rect.width, height:rect.height,
      lastX:e.clientX, lastY:e.clientY, lastBoardPos:null
    };
    moveGhost(e.clientX,e.clientY);
  }

  function moveGhost(x,y){
    if(!drag) return;
    drag.ghost.style.left=(x-drag.dx)+'px';
    drag.ghost.style.top=(y-drag.dy)+'px';
  }
  function pointInBoard(x,y){
    const rect=boardSurface.getBoundingClientRect();
    return x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom;
  }
  function pointInTray(x,y){ return !!document.elementFromPoint(x,y)?.closest('.tray'); }
  function boardPoint(x,y){
    const rect=boardSurface.getBoundingClientRect();
    const maxX=Math.max(0,rect.width-drag.width);
    const maxY=Math.max(0,rect.height-drag.height);
    let rx=x-rect.left-drag.dx;
    let ry=y-rect.top-drag.dy;
    rx=Math.max(0,Math.min(rx,maxX));
    ry=Math.max(0,Math.min(ry,maxY));
    return {
      x:Number(((rx + drag.width/2)/Math.max(1,rect.width)).toFixed(6)),
      y:Number(((ry + drag.height/2)/Math.max(1,rect.height)).toFixed(6)),
      coordinateMode:'centerRatio'
    };
  }

  document.addEventListener('pointermove',e=>{
    if(MOBILE_VIEW_ONLY || !drag) return;
    drag.lastX=e.clientX; drag.lastY=e.clientY;
    moveGhost(e.clientX,e.clientY);
    drag.lastBoardPos=pointInBoard(e.clientX,e.clientY)?boardPoint(e.clientX,e.clientY):null;
  },{passive:false});

  document.addEventListener('pointerup',e=>{
    if(MOBILE_VIEW_ONLY || !drag) return;
    const currentDrag=drag;
    const dropX=Number.isFinite(e.clientX)?e.clientX:drag.lastX;
    const dropY=Number.isFinite(e.clientY)?e.clientY:drag.lastY;
    const pos=drag.lastBoardPos || (pointInBoard(dropX,dropY)?boardPoint(dropX,dropY):null);
    let changed=false;
    if(pos){ placeMagnetAt(pos); changed=true; }
    else if(pointInTray(dropX,dropY)){ returnMagnetToTray(); changed=currentDrag.sourceType==='placed'; }
    currentDrag.ghost.remove();
    drag=null;
    render();
    if(changed) markChanged(80);
    if(currentDrag.sourceType==='status' && ['1F','3F','4F','5F','6F'].includes(currentDrag.value)){
      floorPicker?.classList.remove('open');
      floorPickerToggle?.setAttribute('aria-expanded','false');
    }
  });

  function placeMagnetAt(pos){
    if(drag.sourceType==='placed'){
      const m=day().magnets.find(x=>x.id===drag.fromMagnetId);
      if(m){m.x=pos.x;m.y=pos.y;m.coordinateMode='centerRatio';}
      return;
    }
    if(drag.sourceType==='person'){
      day().magnets=day().magnets.filter(m=>!(m.kind==='person'&&m.personId===drag.personId));
      day().magnets.push({id:'m'+Date.now()+Math.random().toString(16).slice(2),kind:'person',personId:drag.personId,x:pos.x,y:pos.y,coordinateMode:'centerRatio'});
      return;
    }
    if(drag.sourceType==='status'){
      day().magnets.push({id:'m'+Date.now()+Math.random().toString(16).slice(2),kind:'status',value:drag.value,x:pos.x,y:pos.y,coordinateMode:'centerRatio'});
    }
  }

  function returnMagnetToTray(){
    if(drag.sourceType==='placed') day().magnets=day().magnets.filter(m=>m.id!==drag.fromMagnetId);
  }

  $('#undoBtn').onclick=()=>{
    if(MOBILE_VIEW_ONLY) return;
    if(day().strokes.length){day().strokes.pop();markChanged();redrawDrawingFromState();toast('1つ前の手書きを戻しました');}
    else toast('戻せる手書きがありません');
  };

  function clearDrawingCanvas(){
    day().strokes=[];
    day().drawingBase='';
    day().drawingGeneration=newDrawingGeneration();
    resetDrawingBaseImageCache();
    redrawDrawingFromState();
    markChanged(120,'user');
  }

  $('#clearDrawingBtn').onclick=()=>{
    if(MOBILE_VIEW_ONLY) return;
    if(confirm('手書きした内容をすべて消去しますか？\nマグネットの配置と氏名一覧は残ります。')){
      clearDrawingCanvas(); toast('手書き分をすべて消去しました');
    }
  };

  $('#resetPeopleBtn').onclick=()=>{
    if(MOBILE_VIEW_ONLY) return;
    day().magnets=day().magnets.filter(m=>m.kind!=='person');
    markChanged(); render();
  };

  $('#addPersonBtn').onclick=()=>{
    if(MOBILE_VIEW_ONLY) return;
    modal.classList.add('show'); $('#personName').value='';
    setTimeout(()=>$('#personName').focus(),50);
  };
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.classList.remove('show'));
  $('#savePersonBtn').onclick=()=>{
    const name=$('#personName').value.trim();
    if(!name) return;
    state.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name});
    modal.classList.remove('show'); markChanged(); render();
  };
  $('#personName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#savePersonBtn').click();});

  $('#fullBtn').onclick=async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  };

  floorPickerToggle?.addEventListener('pointerup',e=>{
    if(!e.isPrimary) return;
    e.preventDefault();
    e.stopPropagation();
    const open=!floorPicker.classList.contains('open');
    floorPicker.classList.toggle('open',open);
    floorPickerToggle.setAttribute('aria-expanded',open?'true':'false');
  },{passive:false});
  document.addEventListener('pointerdown',e=>{
    if(floorPicker?.classList.contains('open') && !e.target.closest('#floorPicker')){
      floorPicker.classList.remove('open');
      floorPickerToggle.setAttribute('aria-expanded','false');
    }
  });

  document.querySelectorAll('.magnet-box .status-chip').forEach(attachTrayDrag);
  window.addEventListener('resize',scheduleGeometryRefresh);
  document.addEventListener('fullscreenchange',scheduleGeometryRefresh);
  if(window.ResizeObserver){
    const boardResizeObserver=new ResizeObserver(scheduleGeometryRefresh);
    boardResizeObserver.observe(boardSurface);
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') loadRemote({forceVerify:true});
  });
  window.addEventListener('beforeunload',()=>{
    if(isDirty) saveRemote();
  });
  document.addEventListener('dblclick',e=>{
    if(MOBILE_VIEW_ONLY) return;
    const chip=e.target.closest('.floating-chip');
    if(!chip) return;
    day().magnets=day().magnets.filter(m=>m.id!==chip.dataset.magnetId);
    markChanged(); render();
  });

  syncBadge.title='クリックすると再同期／同期診断を行います';
  syncBadge.style.cursor='pointer';
  syncBadge.onclick=async()=>{
    if(isDirty){
      const reqId=pendingSave?.requestId||lastSyncDiagnostic?.requestId||'';
      let diag=lastSyncDiagnostic;
      if(reqId) diag=await fetchDiagnostic(reqId,'manual_diagnostic');
      if(diag){
        const s=diagnosticSummary(diag);
        const server=diag.server||{};
        const meta=server.meta||{};
        alert(
          '同期診断\n\n'+
          '原因候補: '+friendlySyncError(s.err)+'\n'+
          'サーバー最終段階: '+s.stage+'\n'+
          '端末generation: '+(generationId||'-')+'\n'+
          '端末revision: '+revision+'\n'+
          'サーバーgeneration: '+(meta.generationId??'-')+'\n'+
          'サーバーrevision: '+(meta.revision??'-')+'\n'+
          '送信JSON: '+Math.round((diag.payloadChars||0)/1024)+' KB\n'+
          '保存JSON: '+s.size+'\n'+
          'requestId: '+(diag.requestId||'-')+'\n\n'+
          'この内容とGASの実行ログを確認してください。'
        );
      }
      clearTimeout(saveTimer); saveRetryCount=0; saveTimer=setTimeout(saveRemote,100);
    }else{
      loadRemote({initial:true});
    }
  };
  if(MOBILE_VIEW_ONLY){
    drawingMode='pen';
    modeToggle.removeAttribute('tabindex');
    modeToggle.setAttribute('aria-disabled','true');
    eraserModeMark.removeAttribute('tabindex');
    document.querySelectorAll('button, .eraser-mode-mark').forEach(el=>{
      if(el.id!=='fullBtn') el.setAttribute('aria-disabled','true');
    });
    setSyncStatus('loading','● 接続中');
  }
  clearLegacySharedCaches();
  updateModeUi(false);
  render();
  setSyncStatus('loading', MOBILE_VIEW_ONLY ? '● 接続中' : 'サーバー正本確認中');
  setTimeout(()=>loadRemote({initial:true,forceVerify:true}), 50);
  pollTimer=setInterval(()=>{
    pollCount++;
    loadRemote({forceVerify:(pollCount % DRIVE_VERIFY_EVERY_POLLS)===0});
  },POLL_INTERVAL_MS);
})();
</script>

</body>
</html>
