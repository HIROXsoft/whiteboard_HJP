<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f8">
<title>HJP 週間予定</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#15202b;--muted:#6c7b86;--line:#d8e0e5;--accent:#0b5ea8;--accent2:#e7f2fb;--danger:#b42318;--shadow:0 4px 18px rgba(21,32,43,.10);--radius:16px}
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit} button{touch-action:manipulation} input,textarea,select{font-size:16px}
#app{max-width:920px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:50;background:rgba(238,242,245,.96);backdrop-filter:blur(10px);padding:8px 10px 6px;border-bottom:1px solid #d8e0e5}
.brandrow{display:flex;align-items:center;gap:9px} .brand-logo{width:124px;height:auto;display:block} .appname{font-size:18px;font-weight:950;letter-spacing:.04em;white-space:nowrap}
.sync{margin-left:auto;border-radius:999px;border:1px solid #b9c7d0;background:#fff;padding:6px 9px;font-size:12px;font-weight:900;white-space:nowrap;cursor:pointer} .sync.ok{background:#e9f7ee;color:#176a35;border-color:#a8d9b7} .sync.saving,.sync.loading{background:#fff8dc;color:#7a5d00;border-color:#e5d172} .sync.error{background:#fff0f0;color:#a11d1d;border-color:#e1aaaa}
.weeknav{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:center;margin-top:8px} .navbtn{height:42px;border:1px solid #bcc8cf;background:#fff;border-radius:12px;font-weight:950;font-size:20px} .weeklabel{height:42px;border:1px solid #c7d1d7;background:#fff;border-radius:12px;font-weight:950;text-align:center;display:flex;align-items:center;justify-content:center;font-size:15px}
.todaybtn{width:100%;margin-top:6px;height:36px;border:0;background:transparent;color:var(--accent);font-weight:900}
.daytabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-top:5px} .daytab{min-width:0;border:1px solid #cbd5db;background:#fff;border-radius:11px;padding:6px 1px;font-size:11px;font-weight:900;line-height:1.15} .daytab strong{display:block;font-size:15px;margin-top:2px} .daytab.active{background:#0b5ea8;color:#fff;border-color:#0b5ea8} .daytab.weekend{color:#8a3a3a} .daytab.active.weekend{color:#fff}
.toolbar{display:flex;gap:7px;padding:8px 10px 2px} .toolbtn{flex:1;height:42px;border-radius:12px;border:1px solid #bcc8cf;background:#fff;font-weight:900} .toolbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.summary{padding:4px 12px 2px;font-size:13px;color:var(--muted);font-weight:800}
.list{padding:6px 10px 90px;display:flex;flex-direction:column;gap:9px}
.person{background:var(--panel);border:1px solid #d9e1e6;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden} .personhead{display:flex;align-items:center;gap:8px;padding:10px 11px 8px} .avatar{width:38px;height:38px;border-radius:11px;background:#eef4f8;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:950;flex:0 0 auto} .personname{font-size:19px;font-weight:950;letter-spacing:.04em} .dirtydot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#ef9f27;display:none} .person.dirty .dirtydot{display:block}
.statuses{display:flex;gap:5px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none} .status{flex:0 0 auto;border:1px solid #cad5dc;background:#fff;border-radius:999px;padding:7px 11px;font-weight:900;font-size:13px} .status.active{background:#164e75;color:#fff;border-color:#164e75} .status[data-v="休み"].active{background:#9b1c1c;border-color:#9b1c1c} .status[data-v="出張"].active{background:#8a5a00;border-color:#8a5a00} .status[data-v="在宅"].active{background:#166534;border-color:#166534}
.fields{display:grid;grid-template-columns:1fr 110px;gap:8px;padding:0 10px 10px} .field{display:flex;flex-direction:column;gap:4px} .field.full{grid-column:1/-1} label{font-size:11px;color:#687781;font-weight:900} input,textarea{width:100%;border:1px solid #c7d2d9;border-radius:11px;background:#fbfdfe;padding:10px 11px;color:#15202b;outline:none} input:focus,textarea:focus{border-color:#0b5ea8;box-shadow:0 0 0 3px rgba(11,94,168,.12);background:#fff} textarea{resize:vertical;min-height:48px;max-height:120px;line-height:1.35}
.empty{padding:28px 18px;text-align:center;color:#6b7880;background:#fff;border-radius:16px;border:1px solid #d8e0e5}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,25,38,.55);display:none;align-items:flex-end;justify-content:center} .modal.show{display:flex} .sheet{width:min(920px,100%);max-height:88dvh;background:#fff;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));overflow:auto} .sheetbar{width:42px;height:5px;border-radius:99px;background:#ccd4d9;margin:0 auto 10px} .sheet h2{margin:0 0 12px;font-size:21px} .personedit{display:flex;gap:7px;align-items:center;margin:8px 0} .personedit input{flex:1} .smallbtn{height:42px;border:1px solid #c5d0d7;background:#fff;border-radius:10px;padding:0 12px;font-weight:900} .smallbtn.danger{color:var(--danger);border-color:#e4b8b4} .sheetactions{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:10px} .sheetactions button{flex:1;height:46px;border-radius:12px;border:1px solid #bfcbd2;background:#fff;font-weight:950} .sheetactions .primary{background:#0b5ea8;color:#fff;border-color:#0b5ea8}
.lock{position:fixed;inset:0;z-index:90;background:rgba(238,242,245,.82);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:950;color:#384852} body.sync-locked .lock{display:flex} body.sync-locked .list,body.sync-locked .toolbar,body.sync-locked .daytabs{pointer-events:none;opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:#17324d;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.18s;max-width:90vw;text-align:center} .toast.show{opacity:1}
@media(min-width:700px){.list{display:grid;grid-template-columns:1fr 1fr;align-items:start} .top{border-radius:0 0 18px 18px} .brand-logo{width:150px} .appname{font-size:21px}}
</style>
</head>

function defaultState(){return {schema:'hjp_weekly_v1',people:[],weeks:{}}}
function normalize(v){const s=v&&typeof v==='object'?v:defaultState(); if(!Array.isArray(s.people))s.people=[]; if(!s.weeks||typeof s.weeks!=='object')s.weeks={}; s.schema='hjp_weekly_v1'; return s}
function getClientId(){const k='hjp_weekly_client_id';let v=localStorage.getItem(k);if(!v){v='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem(k,v)}return v}
function startOfWeek(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}

function toDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function entry(dateKey,personId){const w=ensureWeek();if(!w.days[dateKey])w.days[dateKey]={entries:{}};if(!w.days[dateKey].entries)w.days[dateKey].entries={};if(!w.days[dateKey].entries[personId])w.days[dateKey].entries[personId]={status:'',schedule:'',time:'',note:'',updatedAt:0,updatedBy:''};return w.days[dateKey].entries[personId]}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

card.querySelectorAll('.status').forEach(btn=>btn.onclick=()=>{const val=btn.dataset.v;setField(p.id,'status',val,card);card.querySelectorAll('.status').forEach(x=>x.classList.toggle('active',x===btn))});card.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('input',()=>setField(p.id,el.dataset.field,el.value,card));el.addEventListener('change',()=>queueSave(120))});list.appendChild(card)})}
function setField(personId,field,value,card){const e=entry(selectedDate,personId);e[field]=String(value??'');e.updatedAt=Date.now();e.updatedBy=clientId;const patch={type:'field',weekKey:weekKey(),date:selectedDate,personId,field,value:e[field],ts:e.updatedAt,clientId};pendingPatches=pendingPatches.filter(p=>!(p.type==='field'&&p.weekKey===patch.weekKey&&p.date===patch.date&&p.personId===personId&&p.field===field));pendingPatches.push(patch);card?.classList.add('dirty');queueSave()}

function compact(){return normalize(JSON.parse(JSON.stringify(state)))}

function isGasConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(GAS_URL)}
function jsonp(params,timeout=REQUEST_TIMEOUT_MS){return new Promise((resolve,reject)=>{if(!isGasConfigured())return reject(new Error('GAS_URL_NOT_CONFIGURED'));const cb='__hjp_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('timeout')),timeout);function finish(err,data){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){}s.remove();err?reject(err):resolve(data)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('network'));s.src=GAS_URL+(GAS_URL.includes('?')?'&':'?')+new URLSearchParams({...params,token:API_TOKEN,callback:cb,_:Date.now()});document.head.appendChild(s)})}
function post(fields){return new Promise((resolve,reject)=>{if(!isGasConfigured())return reject(new Error('GAS_URL_NOT_CONFIGURED'));const n='f_'+Date.now()+'_'+Math.random().toString(36).slice(2);const iframe=document.createElement('iframe');iframe.name=n;iframe.style.display='none';const form=document.createElement('form');form.method='POST';form.action=GAS_URL;form.target=n;form.style.display='none';Object.entries(fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');form.appendChild(i)});document.body.append(iframe,form);try{form.submit();setTimeout(resolve,100)}catch(e){reject(e)}setTimeout(()=>{form.remove();iframe.remove()},25000)})}
function applyPatches(target,patches){target=normalize(target);for(const p of patches){if(p.type==='field'){if(!target.weeks[p.weekKey])target.weeks[p.weekKey]={days:{}};const w=target.weeks[p.weekKey];if(!w.days[p.date])w.days[p.date]={entries:{}};if(!w.days[p.date].entries)w.days[p.date].entries={};if(!w.days[p.date].entries[p.personId])w.days[p.date].entries[p.personId]={status:'',schedule:'',time:'',note:'',updatedAt:0,updatedBy:''};const e=w.days[p.date].entries[p.personId];e[p.field]=p.value;e.updatedAt=Math.max(Number(e.updatedAt||0),Number(p.ts||0));e.updatedBy=p.clientId||''}else if(p.type==='people'){target.people=JSON.parse(JSON.stringify(p.people))}}return target}
async function waitAck(id){const end=Date.now()+9000;while(Date.now()<end){await new Promise(r=>setTimeout(r,500));try{const r=await jsonp({action:'ack',requestId:id,generation:generationId},4500);if(r&&!r.pending)return r}catch(_){}}return null}
async function saveRemote(){if(!remoteReady||saveInFlight||!pendingPatches.length)return;if(!isGasConfigured()){setSync('error','URL未設定');return}saveInFlight=true;const patches=pendingPatches.slice();const requestId=clientId+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);setSync('saving','保存中');try{const payload=JSON.stringify(compact());await post({action:'save',token:API_TOKEN,requestId,clientId,revision,generation:generationId,payload});let ack=await waitAck(requestId);if(ack?.conflict){const r=await jsonp({action:'load',since:-1,generation:generationId,verify:'1'});if(!r?.ok)throw new Error('conflict_reload_failed');state=applyPatches(r.state||defaultState(),pendingPatches);revision=Number(r.revision||0);generationId=String(r.generationId||generationId);saveInFlight=false;render();queueSave(100);return}if(ack?.generationMismatch){pendingPatches=[];saveInFlight=false;await loadRemote({initial:true});toast('サーバーが初期化されたため最新状態を読み直しました');return}if(!ack?.ok)throw new Error(ack?.error||'save_unconfirmed');revision=Number(ack.revision||revision+1);const savedKeys=new Set(patches.map(p=>JSON.stringify(p)));pendingPatches=pendingPatches.filter(p=>!savedKeys.has(JSON.stringify(p)));lastSavedPayload=payload;document.querySelectorAll('.person.dirty').forEach(x=>x.classList.remove('dirty'));setSync(pendingPatches.length?'saving':'ok',pendingPatches.length?'未同期':'同期済み')}catch(e){console.error(e);setSync('error','再試行待ち');toast('保存できませんでした。自動で再試行します');setTimeout(()=>queueSave(100),2200)}finally{saveInFlight=false}}
async function loadRemote({initial=false}={}){if(loadInFlight||saveInFlight||pendingPatches.length)return;if(!isGasConfigured()){setSync('error','GAS URL未設定');return}loadInFlight=true;if(initial)setSync('loading','接続中');try{const r=await jsonp({action:'load',since:initial?-1:revision,generation:generationId,verify:initial?'1':'0'});if(!r?.ok)throw new Error(r?.error||'load_failed');if(r.notModified){remoteReady=true;document.body.classList.remove('sync-locked');setSync('ok','同期済み');return}state=normalize(r.state||defaultState());revision=Number(r.revision||0);generationId=String(r.generationId||'');remoteReady=true;document.body.classList.remove('sync-locked');setSync('ok','同期済み');render()}catch(e){console.error(e);setSync('error','接続待ち');if(initial)document.body.classList.add('sync-locked')}finally{loadInFlight=false}}
function shiftWeek(n){weekStart=addDays(weekStart,n*7);selectedDate=toDateKey(weekStart);render();loadRemote()}
$('#prevWeek').onclick=()=>shiftWeek(-1);$('#nextWeek').onclick=()=>shiftWeek(1);$('#todayWeek').onclick=()=>{weekStart=startOfWeek(new Date());const today=toDateKey(new Date());selectedDate=today>=toDateKey(weekStart)&&today<=toDateKey(addDays(weekStart,6))?today:toDateKey(weekStart);render()};
$('#copyPrevBtn').onclick=()=>{const cur=fromKey(selectedDate),prev=toDateKey(addDays(cur,-1));if(!confirm('前日の予定をこの日にコピーしますか？'))return;for(const p of state.people.filter(x=>!x.deleted)){const src=JSON.parse(JSON.stringify(safeEntry(prev,p.id)));for(const f of FIELDS)setField(p.id,f,src[f]||'',null)}render();queueSave(100);toast('前日の内容をコピーしました')};
function openPeople(){peopleEditor.innerHTML='';state.people.filter(p=>!p.deleted).sort((a,b)=>(a.order??0)-(b.order??0)).forEach(p=>addPersonEditor(p.name,p.id));peopleModal.classList.add('show')}
function addPersonEditor(name='',id=''){const row=document.createElement('div');row.className='personedit';row.dataset.id=id;row.innerHTML=`<input value="${esc(name)}" maxlength="16" placeholder="氏名"><button class="smallbtn danger">削除</button>`;row.querySelector('button').onclick=()=>row.remove();peopleEditor.appendChild(row)}
$('#peopleBtn').onclick=openPeople;$('#closePeople').onclick=()=>peopleModal.classList.remove('show');$('#addPerson').onclick=()=>addPersonEditor();peopleModal.addEventListener('click',e=>{if(e.target===peopleModal)peopleModal.classList.remove('show')});
$('#savePeople').onclick=()=>{const oldById=new Map(state.people.map(p=>[p.id,p]));const rows=[...peopleEditor.querySelectorAll('.personedit')];const next=[];rows.forEach((r,i)=>{const name=r.querySelector('input').value.trim();if(!name)return;let id=r.dataset.id;if(!id)id='p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);next.push({id,name,order:i,updatedAt:Date.now()})});state.people=next;pendingPatches=pendingPatches.filter(p=>p.type!=='people');pendingPatches.push({type:'people',people:JSON.parse(JSON.stringify(next)),ts:Date.now()});peopleModal.classList.remove('show');render();queueSave(100)};
syncBadge.onclick=()=>pendingPatches.length?saveRemote():loadRemote({initial:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!pendingPatches.length)loadRemote()});
render();setTimeout(()=>loadRemote({initial:true}),50);setInterval(()=>loadRemote(),POLL_MS);
})();
</script>
