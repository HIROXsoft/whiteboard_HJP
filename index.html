<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f8">
<title>SCHEDULE BOARD</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14202a;--muted:#64727c;--line:#d6dfe5;--accent:#0b5ea8;--danger:#a61b1b;--trip:#8a5a00;--direct:#0f7182;--shadow:0 3px 14px rgba(20,32,42,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}button,select,input{font:inherit}button,select{touch-action:manipulation}#app{max-width:760px;margin:0 auto;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:30;background:rgba(238,242,245,.98);backdrop-filter:blur(9px);padding:7px 9px 6px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:7px}.brand-logo{display:block;width:116px;height:auto}.appname{font-size:17px;font-weight:950;letter-spacing:.05em;white-space:nowrap}.top-actions{margin-left:auto;display:flex;align-items:center;gap:5px}.member-icon,.view-icon{width:34px;height:34px;border:1px solid #bcc8cf;background:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#334651;cursor:pointer}.member-icon svg,.view-icon svg{width:19px;height:19px;display:block}.member-icon:active,.view-icon:active{transform:scale(.95)}.view-icon.active{background:#0b5ea8;color:#fff;border-color:#0b5ea8}.sync{margin-left:0;border:1px solid #bcc8cf;background:#fff;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900;white-space:nowrap}.sync.ok{background:#e9f7ee;color:#176a35;border-color:#a8d9b7}.sync.saving,.sync.loading{background:#fff8dc;color:#765900;border-color:#e5d172}.sync.error{background:#fff0f0;color:#9b1c1c;border-color:#e1aaaa}
.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:5px;align-items:center;margin-top:7px}.navbtn,.weeklabel{height:39px;border:1px solid #c2cdd4;background:#fff;border-radius:11px;font-weight:950}.navbtn{font-size:20px}.weeklabel{display:flex;align-items:center;justify-content:center;font-size:14px}.todaybtn{width:100%;height:30px;border:0;background:transparent;color:var(--accent);font-weight:900;font-size:13px}
.dayhead{padding:8px 8px 7px;position:sticky;top:118px;z-index:20;background:rgba(238,242,245,.985);border-top:1px solid #cbd6dc;border-bottom:2px solid #b8c6ce;box-shadow:0 4px 10px rgba(20,32,42,.09)}.dayhead-spacer{display:none}.dayhead-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.dayh{position:relative;text-align:center;border:1px solid #c4d0d7;border-radius:10px;background:#fff;padding:7px 1px 6px;font-weight:950;line-height:1;min-height:52px}.dayh .weekday{display:block;font-size:21px;letter-spacing:.06em}.dayh .date{display:block;font-size:11px;margin-top:6px;color:#60717c;font-weight:950}.dayh.today{background:#d8ecff;border:3px solid #0b5ea8;color:#064d86;padding:5px 0 4px;box-shadow:0 0 0 2px rgba(11,94,168,.09),0 3px 9px rgba(11,94,168,.18)}.dayh.today::after{content:'今日';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#0b5ea8;color:#fff;border-radius:999px;padding:2px 6px;font-size:8px;line-height:1;font-weight:950;white-space:nowrap}.dayh.today .date{color:#0b5ea8}.dayh.sat{background:#edf6ff;color:#195f99;border-color:#9fc8e8}.dayh.sat .date{color:#3976a8}.dayh.sun{background:#fff0f0;color:#a12626;border-color:#dfaaaa}.dayh.sun .date{color:#a84a4a}

.list{padding:3px 8px 80px;display:flex;flex-direction:column;gap:7px}.person{background:#fff;border:1px solid #d8e1e6;border-radius:14px;box-shadow:var(--shadow);padding:7px 7px 8px}.person.dirty{outline:2px solid #f1bb55;outline-offset:-2px}.daycell.dirty-cell{box-shadow:inset 0 0 0 2px #f1bb55}.person-name{font-size:16px;font-weight:950;padding:0 2px 6px;display:flex;align-items:center;gap:6px}.weekcells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.daycell{min-width:0;height:88px;border:1px solid #d5dfe5;border-radius:9px;background-color:#f8fafb;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.daycell:active{transform:scale(.97)}.cell-status{font-size:10px;font-weight:950;line-height:1.05;white-space:pre-line}.cell-time{font-size:11px;font-weight:950;margin-top:4px;color:#23333e}.daycell.blank .cell-status{color:#9aa6ad;font-size:16px}.daycell.internal{background-color:#eaf4ff;border-color:#afcfe9;color:#0c527f}.daycell.outing{background-color:#eef7e8;border-color:#b9d7aa;color:#35611f}.daycell.direct{background-color:#e7f7f8;border-color:#a5d3d7;color:#0c6672}.daycell.trip{background-color:#fff5dc;border-color:#e5c983;color:#775000}.daycell.off{background-color:#fff0f0;border-color:#e2b2b2;color:#8c2020}.daycell.noreturn .cell-time{color:#8b3131}.daycell.today-col{border-left:3px solid #0b5ea8;border-right:3px solid #0b5ea8;background-image:linear-gradient(rgba(11,94,168,.105),rgba(11,94,168,.105));box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}.person:first-child .daycell.today-col{border-top:3px solid #0b5ea8}.person:last-child .daycell.today-col{border-bottom:3px solid #0b5ea8}
.empty{padding:28px 16px;text-align:center;color:#6b7880;background:#fff;border-radius:14px;border:1px solid #d8e0e5}.modal{position:fixed;inset:0;z-index:80;background:rgba(10,25,38,.55);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;background:#fff;border-radius:20px 20px 0 0;padding:13px 13px calc(13px + env(safe-area-inset-bottom));overflow:auto}.sheetbar{width:42px;height:5px;border-radius:99px;background:#ccd4d9;margin:0 auto 10px}.sheet h2{margin:0;font-size:20px}.sheetdate{font-size:13px;color:var(--muted);font-weight:850;margin:3px 0 12px}.section-label{font-size:12px;font-weight:950;color:#53646f;margin:10px 0 6px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.edit-status{position:relative;height:48px;border:1px solid #c6d1d8;background:#fff;border-radius:12px;font-size:15px;font-weight:950}.edit-status.active::after{content:attr(data-order);position:absolute;right:5px;top:5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#fff;color:#164e75;font-size:11px;line-height:18px;text-align:center;font-weight:950}.edit-status[data-v="休み"].active::after{color:var(--danger)}.edit-status[data-v="出張"].active::after{color:var(--trip)}.edit-status.active{background:#164e75;color:#fff;border-color:#164e75}.edit-status[data-v="外出"].active{background:#4d7f32;border-color:#4d7f32}.edit-status[data-v="出張"].active{background:var(--trip);border-color:var(--trip)}.edit-status[data-v="休み"].active{background:var(--danger);border-color:var(--danger)}.edit-status[data-v="午前休"].active,.edit-status[data-v="午後休"].active{background:#9b4d7a;border-color:#9b4d7a}
.select-wrap{position:relative}.select-wrap:after{content:'▼';position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:#566873;font-size:13px}.return-select{width:100%;height:54px;border:1px solid #b9c7cf;background:#fff;border-radius:12px;padding:0 42px 0 14px;font-size:18px;font-weight:950;color:#162630;appearance:none;-webkit-appearance:none}.return-select.none{background:#fff4f4;color:#8b2020}.edit-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.donebtn,.clearbtn{height:49px;border-radius:12px;font-weight:950;font-size:16px}.donebtn{border:0;background:var(--accent);color:#fff}.clearbtn{border:1px solid #d8b4b4;background:#fff;color:var(--danger)}
.personedit{display:flex;gap:6px;align-items:center;margin:7px 0}.personedit input{flex:1;min-width:0;height:42px;border:1px solid #c5d0d7;border-radius:10px;padding:0 10px;font-size:16px}.smallbtn{height:42px;border:1px solid #c5d0d7;background:#fff;border-radius:10px;padding:0 11px;font-weight:900}.smallbtn.danger{color:var(--danger);border-color:#e4b8b4}.sheetactions{display:flex;gap:7px;position:sticky;bottom:0;background:#fff;padding-top:9px}.sheetactions button{flex:1;height:45px;border-radius:11px;border:1px solid #bfcbd2;background:#fff;font-weight:950}.sheetactions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.lock{position:fixed;inset:0;z-index:70;background:rgba(238,242,245,.86);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:950;color:#384852}body.sync-locked .lock{display:flex}body.sync-locked .list{pointer-events:none;opacity:.55}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:#17324d;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s;max-width:92vw;text-align:center}.toast.show{opacity:1}
body.pc-view #app{max-width:1440px;padding:0 12px}body.pc-view .top{padding-left:14px;padding-right:14px}body.pc-view .brand-logo{width:155px}body.pc-view .appname{font-size:23px}body.pc-view .dayhead{display:grid;grid-template-columns:158px minmax(0,1fr);gap:0;padding-left:12px;padding-right:12px}body.pc-view .dayhead-spacer{display:block}body.pc-view .dayhead-days{gap:6px;padding-left:8px;padding-right:8px}body.pc-view .list{padding-left:12px;padding-right:12px;gap:5px}body.pc-view .person{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:stretch;padding:5px 7px}body.pc-view .person-name{font-size:18px;padding:0 12px 0 4px;align-items:center;border-right:1px solid #e1e7eb}body.pc-view .weekcells{gap:6px;padding-left:8px}body.pc-view .daycell{height:66px;border-radius:8px}body.pc-view .cell-status{font-size:12px;line-height:1.1}body.pc-view .cell-time{font-size:13px;margin-top:2px}body.pc-view .dayh{min-height:48px;padding-top:5px;padding-bottom:4px}body.pc-view .dayh .weekday{font-size:19px}body.pc-view .dayh .date{margin-top:4px}body.pc-view .sheet{width:min(920px,96vw);border-radius:18px;margin:auto}body.pc-view .modal{align-items:center;padding:20px}body.pc-view .status-grid{grid-template-columns:repeat(4,1fr)}
@media(min-width:620px){.brand-logo{width:145px}.appname{font-size:20px}.daycell{height:84px}.cell-status{font-size:12px}.cell-time{font-size:13px}.person-name{font-size:18px}}
</style>
</head>

function importLegacyPendingIfNeeded(){try{if(localStorage.getItem(PENDING_KEY))return;const raw=localStorage.getItem(LEGACY_PENDING_KEY);if(!raw)return;const old=JSON.parse(raw);if(!Array.isArray(old)||!old.length)return;const converted=old.map(p=>{if(p.type==='entry')return {type:'entry',opId:p.opId||('legacy_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)),date:p.date,weekStart:p.weekStart||weekKeyForDate(p.date),personId:p.personId,entry:{statuses:[...(p.entry?.statuses||[])],returnTime:p.entry?.returnTime||''},expectedVersion:-1,knownWeekRevision:0,generationId:'',createdAt:p.createdAt||Date.now(),legacyImported:true};if(p.type==='people')return {type:'people',opId:p.opId||('legacy_people_'+Date.now().toString(36)),people:p.people||[],expectedPeopleRevision:-1,generationId:'',createdAt:p.createdAt||Date.now(),legacyImported:true};return null}).filter(Boolean);if(converted.length){localStorage.setItem(LEGACY_PENDING_BACKUP,raw);localStorage.setItem(PENDING_KEY,JSON.stringify(converted));localStorage.removeItem(LEGACY_PENDING_KEY)}}catch(e){console.warn('旧未送信差分の移行に失敗',e)}}

if(ack.conflict&&p.type==='people'){const ok=confirm('メンバー一覧が別端末で更新されています。\n\nこの端末の一覧で上書きしますか？');if(ok){const forceId=(requestId+'_force').slice(0,180);await post({...fields,requestId:forceId,force:'1'});ack=await waitAck(forceId,'people','');if(!ack?.ok)throw new Error(ack?.error||'force_people_save_failed')}else{pending=pending.filter(x=>x.opId!==p.opId);persistPending();await loadWeek({force:true});toast('最新のメンバー一覧を表示しました');return}}
if(!ack.ok)throw new Error(ack.error||'save_failed');
const staleWeek=p.type==='entry'&&p.weekStart===currentWeekKey()&&Number(ack.serverRevisionBefore)!==Number(p.knownWeekRevision);pending=pending.filter(x=>x.opId!==p.opId);persistPending();generationId=String(ack.generationId||generationId);
if(p.type==='entry'){if(p.weekStart===currentWeekKey()&&ack.entry){const e=entry(p.date,p.personId);Object.assign(e,normalizeEntry(ack.entry));serverVersions.set(cellKey(p.date,p.personId),Number(ack.entry.version||0));if(!staleWeek)weekRevision=Number(ack.weekRevision||weekRevision)}}else if(p.type==='people'&&ack.people){state.people=ack.people;peopleRevision=Number(ack.peopleRevision||peopleRevision)}
if(staleWeek){await loadWeek({force:true})}else{saveSnapshot();render()}setSync(pending.length?'saving':'ok',pending.length?'未同期':'同期済み')
}catch(e){console.error('保存エラー',e);setSync('error','再試行');setTimeout(()=>queueSave(0),1800)}finally{saveInFlight=false;if(pending.length)setTimeout(()=>queueSave(0),100)}}

async function loadWeek({initial=false,force=false}={}){if(loadInFlight||saveInFlight)return;if(!isGasConfigured()){setSync('error','GAS URL未設定');return}loadInFlight=true;if(initial)setSync('loading','更新確認中');try{const r=await jsonp({action:'loadWeek',weekStart:currentWeekKey(),sincePeople:force?-1:peopleRevision,sinceWeek:force?-1:weekRevision},REQUEST_TIMEOUT_MS);if(!r?.ok)throw new Error(r?.error||'load_failed');const sameGen=reconcileGeneration(String(r.generationId||''));if(!sameGen){peopleRevision=0;weekRevision=0}
if(!r.notModified){state=weekFromPacket(r);peopleRevision=Number(r.peopleRevision||0);weekRevision=Number(r.weekRevision||0);generationId=String(r.generationId||generationId);indexServerVersions();hydratePendingGeneration();applyPendingForWeek();render();saveSnapshot()}remoteReady=true;editingReady=true;document.body.classList.remove('sync-locked');setSync(pending.length?'saving':'ok',pending.length?'未同期':'同期済み');if(pending.length)queueSave(30)}catch(e){console.error('読み込みエラー',e);remoteReady=false;setSync('error',editingReady?'オフライン':'接続待ち');if(!editingReady)document.body.classList.add('sync-locked')}finally{loadInFlight=false}}

function showSnapshotIfAny(){try{const raw=localStorage.getItem(snapshotKey());if(!raw)return false;const snap=JSON.parse(raw);if(!snap?.state||!snap.generationId)return false;state=normalize(snap.state);peopleRevision=Number(snap.peopleRevision||0);weekRevision=Number(snap.weekRevision||0);generationId=String(snap.generationId||'');indexServerVersions();hydratePendingGeneration();applyPendingForWeek();editingReady=true;document.body.classList.remove('sync-locked');render();setSync('loading','更新確認中');return true}catch(_){return false}}

function shiftWeek(n){weekStart=addDays(weekStart,n*7);peopleRevision=0;weekRevision=0;remoteReady=false;editingReady=false;state=defaultState();document.body.classList.add('sync-locked');showSnapshotIfAny();render();loadWeek({initial:true,force:true})}$('#prevWeek').onclick=()=>shiftWeek(-1);$('#nextWeek').onclick=()=>shiftWeek(1);$('#todayWeek').onclick=()=>{weekStart=startOfWeek(new Date());peopleRevision=0;weekRevision=0;remoteReady=false;editingReady=false;state=defaultState();document.body.classList.add('sync-locked');showSnapshotIfAny();render();loadWeek({initial:true,force:true})};

function openPeople(){if(!editingReady)return;peopleEditor.innerHTML='';state.people.filter(p=>!p.deleted).sort((a,b)=>(a.order??0)-(b.order??0)).forEach(p=>addPersonEditor(p.name,p.id));peopleModal.classList.add('show')}function addPersonEditor(name='',id=''){const row=document.createElement('div');row.className='personedit';row.dataset.id=id;row.innerHTML=`<input value="${esc(name)}" maxlength="16" placeholder="氏名"><button class="smallbtn danger">削除</button>`;row.querySelector('button').onclick=()=>row.remove();peopleEditor.appendChild(row)}$('#peopleBtn').onclick=openPeople;$('#closePeople').onclick=()=>peopleModal.classList.remove('show');$('#addPerson').onclick=()=>addPersonEditor();peopleModal.addEventListener('click',e=>{if(e.target===peopleModal)peopleModal.classList.remove('show')});$('#savePeople').onclick=()=>{const rows=[...peopleEditor.querySelectorAll('.personedit')],next=[];rows.forEach((r,i)=>{const name=r.querySelector('input').value.trim();if(!name)return;let id=r.dataset.id;if(!id)id='p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);next.push({id,name,order:i,updatedAt:Date.now()})});state.people=next;queuePeoplePatch(next);peopleModal.classList.remove('show');render()};

async function togglePcView(){const enable=!document.body.classList.contains('pc-view');document.body.classList.toggle('pc-view',enable);viewBtn?.classList.toggle('active',enable);viewBtn?.setAttribute('aria-pressed',enable?'true':'false');try{if(enable&&!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(!enable&&document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen()}catch(e){}}
viewBtn?.addEventListener('click',togglePcView);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('pc-view')){document.body.classList.remove('pc-view');viewBtn?.classList.remove('active');viewBtn?.setAttribute('aria-pressed','false')}});

syncBadge.onclick=()=>pending.length?queueSave(0):loadWeek({force:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pollMeta();if(pending.length)queueSave(10)}});
window.addEventListener('online',()=>{setSync('loading','再接続中');loadWeek({force:true});if(pending.length)queueSave(50)});
window.addEventListener('offline',()=>setSync('error',editingReady?'オフライン':'接続待ち'));

showSnapshotIfAny();render();setTimeout(()=>loadWeek({initial:true,force:true}),40);schedulePoll();
})();

</script>
</body></html>
